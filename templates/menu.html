<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>菜单原数据 · 刘和牛备餐系统</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .pkg-card{background:#fff;border:1px solid var(--border-l);border-radius:12px;margin:12px 0;overflow:hidden}
  .pkg-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;
            background:linear-gradient(90deg,#8e1e1a,#c0392b);color:#fff}
  .pkg-head h3{margin:0;font-size:16px}
  .pkg-meta{font-size:12px;opacity:.85}
  .pkg-body{padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease}
  .pkg-card.open .pkg-body{max-height:none}
  .pkg-card.open .pkg-head{border-radius:0}
  .pkg-toggle{font-size:18px;font-weight:700;transition:transform .2s}
  .pkg-card.open .pkg-toggle{transform:rotate(180deg)}
  .ing-tbl{width:100%;border-collapse:collapse;font-size:14px}
  .ing-tbl th{background:#f5efe8;padding:8px 6px;text-align:left;font-size:11px;color:var(--muted);
              position:sticky;top:0;border-bottom:2px solid var(--border)}
  .ing-tbl td{padding:7px 6px;border-bottom:1px solid #f0ebe3}
  .ing-tbl tr.cat-row td{font-weight:700;color:#fff;font-size:10px;padding:4px 6px;text-align:center;white-space:nowrap;line-height:1.2}
  .ing-tbl tr.cat-row td:first-child{text-align:left}
  .ing-tbl input{width:60px;padding:4px 4px;border:1px solid var(--border);border-radius:6px;font-size:14px;text-align:center}
  .ing-tbl input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(192,57,43,.15)}
  .ing-tbl .name-cell{font-weight:600;min-width:80px}
  .ing-tbl .total-cell{font-weight:800;color:var(--primary);text-align:center}
  .ing-tbl td{text-align:center}
  .ing-tbl .btn-mini{padding:3px 6px;font-size:11px;border-radius:6px;border:1px solid var(--border);
                     background:#fff;cursor:pointer;color:var(--muted)}
  .ing-tbl .btn-mini:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
  .ing-tbl .btn-mini.del:hover{background:#c0392b}
  .ing-tbl .btn-mini.save{background:var(--green);color:#fff;border-color:var(--green)}
  .ing-tbl .row-editing{background:#fff8e1}
  .add-row{display:flex;gap:6px;padding:10px;background:#faf5ed;align-items:center;flex-wrap:wrap}
  .add-row select,.add-row input{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .add-row select{flex:1;min-width:120px}
  .add-row input{width:55px;text-align:center}
  .add-row .btn-add{padding:5px 12px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px}
  .toolbar{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
  .toolbar .btn{font-size:12px;padding:6px 10px}
  @media(max-width:600px){
    .pkg-head{padding:10px 12px}
    .pkg-head h3{font-size:15px}
    .pkg-meta{font-size:11px}
    .ing-tbl{font-size:13px}
    .ing-tbl th,.ing-tbl td{padding:6px 4px}
    .ing-tbl input{width:50px;font-size:13px}
    /* 工具栏在手机端改为单行横滑：8个按钮不再折成多行占垂直空间，腾出位置看菜单数据 */
    .toolbar{overflow-x:auto;flex-wrap:nowrap;margin:10px 0;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .toolbar .btn{flex:0 0 auto;font-size:11px;padding:5px 8px}
  }
  .cat-beef{background:#8e1e1a}
  .cat-pork{background:#c75d3e}
  .cat-chicken{background:#c9962b}
  .cat-vegetable{background:#3a8a3a}
  .cat-side{background:#5a8a3a}
  .cat-sauce{background:#7a5a3a}
  .cat-packaging{background:#d35400}
  .cat-utensil,.cat-tableware{background:#8e44ad}
  .cat-tool{background:#4a4a4a}
  .badge-cat{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;color:#fff;margin-left:4px}
</style>
</head>
<body>
{% include 'topbar.html' %}

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;flex-wrap:wrap;gap:8px">
    <div>
      <div class="title">📜 菜单原数据</div>
      <div class="sub page-sub">查看/修改套餐食材配量 · 份数 × 每份数量(单位) = 总量</div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary btn-sm btn-refresh" onclick="refreshWithFx(loadMenu)"><span class="btn-icon" title="同步最新数据（页面每60秒会自动同步一次）">🔄</span></button>
      <button class="btn btn-sm btn-save-all" style="background:#27ae60;color:#fff" onclick="saveAll()">💾 保存全部修改</button>
      <button class="btn btn-sm" style="background:#6b4f3a;color:#fff" onclick="openCatering()">🍱 餐标配餐器</button>
      <button class="btn btn-accent btn-sm" onclick="expandAll()">📂 全展开</button>
      <button class="btn btn-sm" onclick="collapseAll()">📦 全收起</button>
      <button class="btn btn-sm" onclick="exportAllXlsx()">📊 导出菜单表(Excel)</button>
      <button class="btn btn-sm" style="background:#c0392b;color:#fff" onclick="window.open('/menu/print/customer','_blank')">🖨️ 顾客菜单(打印)</button>
      <button class="btn btn-sm" style="background:#2c1810;color:#fff" onclick="window.open('/menu/print/cost','_blank')">💰 成本菜单(打印)</button>
    </div>
  </div>

  <div id="menuList"></div>
</div>

<!-- ===== 餐标配餐器弹窗 ===== -->
<div id="cateringModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;overflow:auto;padding:20px">
  <div style="background:#fff;max-width:900px;margin:0 auto;border-radius:14px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0;color:var(--primary)">🍱 餐标配餐器</h2>
      <button class="btn btn-sm" onclick="closeCatering()">✕ 关闭</button>
    </div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px;background:#faf5ed;border-radius:10px">
      <label>人数 <input type="number" id="cat_people" value="16" min="1" style="width:70px;padding:6px;border:1px solid #ddd;border-radius:6px"></label>
      <label>总餐标 ¥ <input type="number" id="cat_budget" value="1000" min="0" step="50" style="width:100px;padding:6px;border:1px solid #ddd;border-radius:6px"></label>
      <span style="color:#888">或</span>
      <label>人均 ¥ <input type="number" id="cat_perperson" placeholder="如60" style="width:80px;padding:6px;border:1px solid #ddd;border-radius:6px"></label>
      <button class="btn btn-primary btn-sm" onclick="generateCatering()">🚀 生成方案</button>
    </div>

    <div style="font-size:12px;color:#888;margin-bottom:8px">💡 总餐标与人均可互填：填一个会自动算出另一个</div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:#eef6ff;border-radius:10px">
      <span style="font-weight:700;color:#27ae60">配餐基准：</span>
      <label><input type="radio" name="cat_mode" value="package" checked onchange="toggleCatMode()"> 按最近套餐缩放</label>
      <label><input type="radio" name="cat_mode" value="template" onchange="toggleCatMode()"> 📐 标准人均克重模板</label>
    </div>
    <div id="tplPanel" style="display:none;margin-bottom:12px;padding:12px;background:#f0f7ff;border:1px solid #bcd4ef;border-radius:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
        <b style="color:#2c6">📐 标准人均克重模板</b>
        <span style="font-size:12px;color:#666">每类每人多少克，改完直接生成试效果（不保存也能看）</span>
        <button class="btn btn-sm" onclick="saveTemplate()">💾 保存此模板</button>
      </div>
      <div id="tplGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:13px"></div>
      <div style="margin-top:8px;font-size:13px">
        目标利润率 <input type="number" id="tpl_margin" value="40" min="0" max="90" style="width:60px"> %（成本上限 = 餐标 × (100 − 此值)）
      </div>
      <div style="margin-top:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px">
        <label><input type="checkbox" id="tpl_is_setup"> 含搭建（收搭建回收，不计配送）</label>
        <label>配送地址 <input type="text" id="tpl_address" placeholder="如：青龙湖二期（留空按全局均价）" style="width:240px;padding:5px;border:1px solid #ddd;border-radius:6px"></label>
        <label>切配人工 ¥<input type="number" id="tpl_cutting" value="40" min="0" style="width:60px;padding:5px;border:1px solid #ddd;border-radius:6px"></label>
        <label>馒头 <input type="number" id="tpl_mantou" value="1.6" min="0" step="0.1" style="width:60px;padding:5px;border:1px solid #ddd;border-radius:6px"> 个/人</label>
        <label><input type="checkbox" id="tpl_include_dep"> 计入折旧（自有装备×租金×10%）</label>
      </div>
      <div style="margin-top:8px;font-size:13px">
        人均克重比例
        <input type="range" id="tpl_scale" min="1" max="200" value="100" oninput="document.getElementById('tpl_scale_val').textContent=this.value+'%'">
        <b id="tpl_scale_val">100%</b>
        <span style="color:#888">（基准 = 10人餐人均克重，1%–200% 可调）</span>
      </div>
    </div>

    <div id="cateringResult"></div>

    <div id="cateringSaveBox" style="display:none;margin-top:16px;padding:12px;background:#e7f5e7;border-radius:10px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label>套餐名 <input type="text" id="cat_pkgname" placeholder="如：定制16人1000元" style="flex:1;min-width:200px;padding:6px;border:1px solid #ddd;border-radius:6px"></label>
        <button class="btn btn-primary" onclick="saveCatering()">💾 保存为定制套餐</button>
      </div>
    </div>
  </div>
</div>

<script>
let packages = [];
let allIngredients = [];
const CAT_LABEL = {
  beef:'🥩牛肉', pork:'🥓猪肉', chicken:'🍗鸡肉',
  vegetable:'🥬素菜', side:'🥗小菜', sauce:'🧂小料', drink:'🎁赠品',
  packaging:'📦食材包装',
  utensil:'🍱客户餐具',
  other:'其他', tool:'🔧工具'
};
const CAT_ORDER = ['beef','pork','chicken','vegetable','side','sauce','drink','packaging','utensil','other','tool'];

// 固定排序顺序（与后端 INGREDIENT_FIXED_ORDER 一致）
// 注：菜单页 side(小菜) 与 sauce(蘸料) 分开显示，故分别定义
const FIXED_ORDER = [
  ['beef','肥牛'],['beef','拌牛肉'],['beef','牛肋条'],['beef','牛骰子'],['beef','小肠'],
  ['pork','五花肉'],['pork','小香猪'],['pork','松板肉'],['pork','风味肠'],['pork','梅花肉'],
  ['chicken','鸡尖'],['chicken','郡肝'],['chicken','鸡腿肉'],['chicken','鸡翅根'],['chicken','掌中宝'],['chicken','鸡脚筋'],
  ['vegetable','生菜'],['vegetable','豆腐'],['vegetable','西葫芦'],['vegetable','土豆'],['vegetable','馒头'],['vegetable','韭菜'],['vegetable','杏鲍菇'],['vegetable','洋葱'],
  ['side','海带丝'],['side','辣椒段'],['side','辣白菜'],['side','蒜片'],
  ['sauce','川香'],['sauce','五香'],['sauce','酸辣'],
  // 客户餐具固定顺序（用户 2026-10-04 指定）：不再按数量降序（会导致各套餐乱跳、破坏观看惯性）
  // 注：一次性油壶属食材包装（作成本项）；小料中的油属客户餐具
  ['utensil','三格底料盒'],['utensil','筷子'],['utensil','勺子'],['utensil','纸杯'],
  ['utensil','纸巾'],['utensil','围裙'],['utensil','油'],['utensil','垃圾袋'],['utensil','一次性桌布'],
  // 食材包装固定顺序（防止数量反超时翻转，与餐具同理；一次性油壶属包装）
  ['packaging','金色打包盒'],['packaging','圆形透明打包盒'],['packaging','生菜水果打包盒'],['packaging','烤肉盒子'],['packaging','绑带'],
  ['packaging','杂物保温袋'],['packaging','餐具打包袋'],['packaging','一次性油壶'],
];
function getFixedIdx(name, cat){
  for(let i=0;i<FIXED_ORDER.length;i++){
    if(FIXED_ORDER[i][0]===cat && (name||'').includes(FIXED_ORDER[i][1])) return i;
  }
  return 999;
}

// 细分 meat → beef/pork/chicken（与 calculator 一致）
function subcategorize(name, cat){
  const n = name || '';
  // 馒头归素菜（用户指定）
  if(/馒头/.test(n)) return 'vegetable';
  if(cat !== 'meat') return cat;
  // 小肠优先归牛肉（爆汁烤小肠 = 牛肠）
  if(/小肠/.test(n)) return 'beef';
  if(/牛|肥牛|牛肋|牛骰|安格斯/.test(n)) return 'beef';
  if(/鸡|鸡翅|鸡腿|郡肝|掌中宝|脚筋/.test(n)) return 'chicken';
  if(/猪|五花|香猪|松板|梅花|风味肠|肠/.test(n)) return 'pork';
  return 'beef';
}

// 带自动重试的取数：Render 免费实例休眠后冷启动，首次请求可能失败/超时，
// 自动重试可避免"页面空白、要手动刷新"的问题。
async function fetchJSONRetry(url, tries){
  tries = tries || 4;
  for(let i=1;i<=tries;i++){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(r.ok) return await r.json();
    }catch(e){ /* 网络失败：继续重试 */ }
    if(i < tries) await new Promise(s=>setTimeout(s, 1200));
  }
  return null;
}

function loadMenu(){
  const box = document.getElementById('menuList');
  // 首次加载时给出提示，避免"空白无反馈"
  if(box && !packages.length){
    box.innerHTML = '<div class="muted" style="padding:24px;text-align:center">'+
      '⏳ 加载中…<br><span style="font-size:12px">若系统刚休眠，首次打开可能需要几十秒</span></div>';
  }
  Promise.all([
    fetchJSONRetry('/api/packages'),
    fetchJSONRetry('/api/ingredients')
  ]).then(([pkgRes, ingRes])=>{
    if(!pkgRes || !ingRes){
      if(box) box.innerHTML = '<div class="muted" style="padding:24px;text-align:center">'+
        '⚠️ 数据加载失败（网络异常或系统正在启动）<br><br>'+
        '<button class="btn btn-primary btn-sm" onclick="loadMenu()">🔄 重新加载</button></div>';
      return;
    }
    packages = pkgRes.data || [];
    allIngredients = (ingRes.data || []).sort((a,b)=>a.name.localeCompare(b.name,'zh'));
    render();
  });
}

function render(){
  const box = document.getElementById('menuList');
  if(!packages.length){
    box.innerHTML = '<div class="muted" style="padding:24px;text-align:center">暂无套餐数据</div>';
    return;
  }
  box.innerHTML = packages.map((p,idx)=>renderPkg(p,idx)).join('');
}

function renderPkg(p, idx){
  const ings = p.ingredients || [];
  // 按分类分组
  const byCat = {};
  ings.forEach(ing=>{
    const c = subcategorize(ing.ing_name, ing.category);
    if(!byCat[c]) byCat[c] = [];
    byCat[c].push(ing);
  });
  // 工具单独一组
  const tools = p.tools || [];
  // 统计荤菜(牛猪鸡)/素菜(素菜+小菜)数量：按 portion_count 累加
  // 同菜品多份对客户感知是"多了一道菜"，不是去重计数
  let meatCount = 0, vegCount = 0;
  ['beef','pork','chicken'].forEach(c => {
    (byCat[c]||[]).forEach(i => { meatCount += Math.round(i.portion_count||1); });
  });
  ['vegetable','side'].forEach(c => {
    (byCat[c]||[]).forEach(i => { vegCount += Math.round(i.portion_count||1); });
  });

  let bodyHtml = '<table class="ing-tbl"><thead><tr>'+
    '<th>名称</th><th>份数</th><th>每份数量</th><th>单位</th><th>总量</th><th>保存</th><th>删除</th>'+
    '</tr></thead><tbody>';
  for(const cat of CAT_ORDER){
    const items = byCat[cat];
    if(!items || !items.length) continue;
    // 固定顺序排序，不在列表的按每份用量降序
    items.sort((a,b)=>{
      const ia = getFixedIdx(a.ing_name, cat);
      const ib = getFixedIdx(b.ing_name, cat);
      if(ia!==ib) return ia-ib;
      return (b.per_package||0)-(a.per_package||0);
    });
    const label = CAT_LABEL[cat] || cat;
    // 食材包装/客户餐具：去掉每份数量列头（只保留份数+单位）
    const isSimpleCat = ['packaging','utensil'].includes(cat);
    const perHead = isSimpleCat ? '<td></td>' : '<td>每份数量</td>';
    bodyHtml += `<tr class="cat-row cat-${cat}">
      <td>${label} · ${items.length}项</td><td>份数</td>${perHead}<td>单位</td><td>总量</td><td>保存</td><td>删除</td>
    </tr>`;
    items.forEach(ing=>{
      const size = ing.per_package / Math.max(1, ing.portion_count||1);
      bodyHtml += renderIngRow(ing, size, p.id);
    });
  }
  if(tools.length){
    bodyHtml += `<tr class="cat-row cat-tool">
      <td>🔧 工具装备 · ${tools.length}项</td><td>份数</td><td></td><td>单位</td><td>总量</td><td>保存</td><td>删除</td>
    </tr>`;
    tools.forEach(t=>{
      bodyHtml += renderToolRow(t, p.id);
    });
  }
  // 新增食材行
  bodyHtml += `<tr><td colspan="7" style="padding:0">
    <div class="add-row">
      <select id="newIng_${p.id}">
        <option value="">+ 选择食材添加...</option>
        ${allIngredients.map(i=>`<option value="${i.id}">${i.name} (${i.unit}) [${CAT_LABEL[subcategorize(i.name,i.category)]||i.category}]</option>`).join('')}
      </select>
      <input type="number" id="newSize_${p.id}" placeholder="克数" step="0.1">
      <input type="number" id="newCnt_${p.id}" placeholder="份数" step="1" value="1">
      <button class="btn-add" onclick="addIng(${p.id})">➕ 添加</button>
    </div></td></tr>`;
  bodyHtml += '</tbody></table>';

  return `<div class="pkg-card" id="pkg_${p.id}">
    <div class="pkg-head" onclick="togglePkg(${p.id})">
      <div>
        <h3>${p.name}</h3>
        <div class="pkg-meta">${p.min_people}-${p.max_people}人 · 总价¥${p.price} · 荤菜${meatCount}/素菜${vegCount}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn btn-sm btn-save-pkg" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:12px;padding:4px 10px" onclick="event.stopPropagation();savePkg(${p.id})">💾 保存本套餐</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:12px;padding:4px 10px" onclick="event.stopPropagation();exportPkgXlsx(${p.id})">📊 导出</button>
        <span class="pkg-toggle">▾</span>
      </div>
    </div>
    <div class="pkg-body">${bodyHtml}</div>
  </div>`;
}

// 取分类标签的纯emoji（去掉文字，只保留图标）
function catEmoji(cat){
  const lbl = CAT_LABEL[cat] || '';
  return lbl.replace(/[\u4e00-\u9fa5\w\s]/g,'').trim();
}

// 判断是否为"简单分类"（无每份数量）：食材包装/客户餐具/工具 + 可乐雪碧饮料
// 注：应季水果有克数，仍显示每份数量；可乐/雪碧按瓶计，只保留份数
function isSimpleCat(name, cat){
  if(['packaging','utensil','tool'].includes(cat)) return true;
  // 饮料中仅可乐/雪碧按份数计（每份数量=1瓶），应季水果仍按克数
  if(cat==='drink' && /可乐|雪碧/.test(name||'')) return true;
  return false;
}

function renderIngRow(ing, size, pid){
  const rowId = `ing_${ing.id}`;
  const c = subcategorize(ing.ing_name, ing.category);
  // 简单分类（食材包装/客户餐具/可乐雪碧）：去掉每份数量列，份数为编辑框（每份数量隐含=1，总量=份数）
  // 总量列统一为"数字+单位"格式（如 600克、8个）
  if(isSimpleCat(ing.ing_name, c)){
    const cnt = Math.round((ing.per_package||0)*100)/100;
    const unit = ing.unit||'';
    return `<tr id="${rowId}">
      <td class="name-cell">${ing.ing_name}<span class="badge-cat cat-${c}">${catEmoji(c)}</span></td>
      <td><input type="number" value="${cnt}" step="1" id="cnt_${ing.id}"></td>
      <td class="muted" style="font-size:11px">—</td>
      <td>${unit}</td>
      <td class="total-cell" id="tot_${ing.id}">${cnt}${unit}</td>
      <td><button class="btn-mini save" onclick="saveIng(${pid},${ing.id})">💾</button></td>
      <td><button class="btn-mini del" onclick="delIng(${pid},${ing.id})">🗑️</button></td>
    </tr>`;
  }
  const unit = ing.unit||'';
  return `<tr id="${rowId}">
    <td class="name-cell">${ing.ing_name}<span class="badge-cat cat-${c}">${catEmoji(c)}</span></td>
    <td><input type="number" value="${ing.portion_count||1}" step="1" id="cnt_${ing.id}"></td>
    <td><input type="number" value="${Math.round(size*100)/100}" step="0.1" id="sz_${ing.id}"></td>
    <td>${unit}</td>
    <td class="total-cell" id="tot_${ing.id}">${ing.per_package}${unit}</td>
    <td><button class="btn-mini save" onclick="saveIng(${pid},${ing.id})">💾</button></td>
    <td><button class="btn-mini del" onclick="delIng(${pid},${ing.id})">🗑️</button></td>
  </tr>`;
}

function renderToolRow(t, pid){

  const unit = '个';

    <td class="name-cell">${t.tool_name}<span class="badge-cat cat-tool">${catEmoji('tool')}</span></td>

// 实时计算总量（列序：名称|份数|每份数量|单位|总量|保存|删除）
// 注：食材包装/客户餐具无 每份数量(sz_) 输入框，总量=份数×1
document.addEventListener('input', e=>{
  if(e.target.id && e.target.id.startsWith('sz_')){
    const id = e.target.id.split('_')[1];
    const sz = parseFloat(e.target.value)||0;
    const cnt = parseFloat(document.getElementById('cnt_'+id).value)||1;
    const row = document.getElementById('ing_'+id);
    const unit = row.querySelector('td:nth-child(4)').textContent;
    document.getElementById('tot_'+id).textContent = Math.round(sz*cnt*100)/100 + unit;
  }
  if(e.target.id && e.target.id.startsWith('cnt_')){
    const id = e.target.id.split('_')[1];
    const szEl = document.getElementById('sz_'+id);
    const sz = szEl ? (parseFloat(szEl.value)||0) : 1;  // 包装/餐具无 sz_，隐含=1
    const cnt = parseFloat(e.target.value)||1;
    const row = document.getElementById('ing_'+id);
    const unit = row.querySelector('td:nth-child(4)').textContent;
    document.getElementById('tot_'+id).textContent = Math.round(sz*cnt*100)/100 + unit;
  }
  if(e.target.id && e.target.id.startsWith('tqty_')){
    const id = e.target.id.split('_')[1];
    const v = parseFloat(e.target.value)||0;
    document.getElementById('ttot_'+id).textContent = Math.round(v*100)/100 + '个';
  }
});

function saveIng(pid, ingId){
  const cntEl = document.getElementById('cnt_'+ingId);
  const szEl = document.getElementById('sz_'+ingId);
  const cnt = parseFloat(cntEl.value)||1;
  // 食材包装/客户餐具无 sz_ 输入框，每份数量隐含=1
  const sz = szEl ? (parseFloat(szEl.value)||0) : 1;
  fetch(`/api/packages/${pid}/ingredient/${ingId}`,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({portion_size:sz, portion_count:cnt})
  }).then(r=>r.json()).then(res=>{
    if(res.ok){
      const row = document.getElementById('ing_'+ingId);
      const unit = row.querySelector('td:nth-child(4)').textContent;
      document.getElementById('tot_'+ingId).textContent = Math.round(res.per_package*100)/100 + unit;
      row.style.background = '#e8f5e9';
      setTimeout(()=>row.style.background='', 800);
    }
  });
}

function delIng(pid, ingId){
  if(!confirm('确认删除该食材配量?')) return;
  fetch(`/api/packages/${pid}/ingredient/${ingId}`,{method:'DELETE'})
    .then(r=>r.json()).then(res=>{ if(res.ok) loadMenu(); });
}

function saveTool(pid, ptId){
  const v = parseFloat(document.getElementById('tqty_'+ptId).value)||1;
  fetch(`/api/packages/${pid}/tool/${ptId}`,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({per_package:v})
  }).then(r=>r.json()).then(res=>{
    if(res.ok){
      document.getElementById('ttot_'+ptId).textContent = Math.round((res.per_package||v)*100)/100 + '个';
      const row = document.getElementById('tool_'+ptId);
      row.style.background = '#e8f5e9';
      setTimeout(()=>row.style.background='', 800);
    }
  });
}

function delTool(pid, ptId){
  if(!confirm('确认删除该工具配量?')) return;
  fetch(`/api/packages/${pid}/tool/${ptId}`,{method:'DELETE'})
    .then(r=>r.json()).then(res=>{ if(res.ok) loadMenu(); });
}

// 批量保存某套餐：读取该卡片内所有 份数/每份数量/工具数量 输入框，一次性 PUT（免去逐条点保存）
async function savePkg(pid){
  const card = document.getElementById('pkg_'+pid);
  if(!card) return;
  const btn = card.querySelector('.btn-save-pkg');
  const reqs = [];
  // 食材行（ing_<pi_id>）：cnt_=份数，sz_=每份数量（包装/餐具无 sz_ → 隐含 1）
  card.querySelectorAll('tr[id^="ing_"]').forEach(row=>{
    const id = row.id.split('_')[1];
    const cntEl = document.getElementById('cnt_'+id);
    if(!cntEl) return;
    const szEl = document.getElementById('sz_'+id);
    const cnt = parseFloat(cntEl.value)||1;
    const sz = szEl ? (parseFloat(szEl.value)||0) : 1;
    reqs.push(fetch(`/api/packages/${pid}/ingredient/${id}`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({portion_size:sz, portion_count:cnt})
    }));
  });
  // 工具行（tool_<pt_id>）：tqty_=数量
  card.querySelectorAll('tr[id^="tool_"]').forEach(row=>{
    const id = row.id.split('_')[1];
    const v = parseFloat(document.getElementById('tqty_'+id).value)||1;
    reqs.push(fetch(`/api/packages/${pid}/tool/${id}`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({per_package:v})
    }));
  });
  if(!reqs.length) return;
  if(btn){ btn.disabled = true; const _t = btn.textContent; btn.textContent = '⏳ 保存中…'; btn._t = _t; }
  await Promise.all(reqs.map(r=>r.then(x=>x.json()).catch(()=>({}))));
  if(btn){ btn.disabled = false; btn.textContent = btn._t || '💾 保存本套餐'; }
  card.style.outline = '2px solid #27ae60';
  setTimeout(()=>{ card.style.outline = ''; }, 1200);
  showRefreshToast();
}

// 用 fetch+blob 下载：完全不触发页面导航（不写历史记录），手机点完原地下载、随时能后退。
// 老浏览器不支持 a.download 时回退到新标签打开（可关闭返回，不卡死）；出错时转 toast 提示。
function downloadFile(url){
  if (typeof showToast === 'function') showToast('⏳ 正在生成导出文件…');
  fetch(url, {credentials: 'include'})
    .then(async function(resp){
      const ct = (resp.headers.get('Content-Type') || '').toLowerCase();
      const isFile = resp.ok && (
        ct.indexOf('spreadsheetml') >= 0 || ct.indexOf('csv') >= 0 ||
        ct.indexOf('octet-stream') >= 0 || ct.indexOf('excel') >= 0 || ct.indexOf('zip') >= 0
      );
      if (!isFile){
        let msg = '导出失败';
        try { const j = await resp.json(); if (j && j.msg) msg = j.msg; } catch(e){}
        if (typeof showToast === 'function') showToast('⚠️ ' + msg); else alert(msg);
        return;
      }
      const blob = await resp.blob();
      const cd = resp.headers.get('Content-Disposition') || '';
      const m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
      let fname = m ? m[1] : 'export.xlsx';
      try { fname = decodeURIComponent(fname); } catch(e){}
      const a = document.createElement('a');
      if (typeof a.download === 'undefined'){ window.open(url, '_blank'); return; }
      const u = URL.createObjectURL(blob);
      a.href = u; a.download = fname;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1500);
    })
    .catch(function(err){
      if (typeof showToast === 'function') showToast('⚠️ 导出失败：' + err); else alert('导出失败：' + err);
    });
}

let cateringData = null;  // 当前生成的方案，供保存用
let cateringExcluded = new Set();  // 配餐器中被客户排除(自带)的装备名集合，生成时回传后端
const CAT_COLOR = {beef:'#8e1e1a',pork:'#c75d3e',chicken:'#c9962b',vegetable:'#3a8a3a',
  side:'#5a8a3a',sauce:'#7a5a3a',drink:'#666',other:'#666',
  packaging:'#d35400',utensil:'#8e44ad',tool:'#4a4a4a',meat:'#8e1e1a'};

function openCatering(){
  document.getElementById('cateringModal').style.display='block';
  cateringExcluded = new Set();  // 每次打开弹窗清空排除项，避免上次残留
  // 总餐标 ↔ 人均 双向联动：填一个自动算另一个
  const pe = document.getElementById('cat_people');
  const be = document.getElementById('cat_budget');
  const pe_p = document.getElementById('cat_perperson');
  const linkFrom = (src)=>{
    const p = parseInt(pe.value)||0;
    if(p <= 0) return;
    if(src === 'budget'){
      const b = parseFloat(be.value)||0;
      pe_p.value = Math.round(b / p * 100) / 100;
    } else if(src === 'perperson'){
      const pp = parseFloat(pe_p.value)||0;
      be.value = Math.round(pp * p);
    } else { // people 变动：优先按人均反推总餐标，否则按总餐标推人均
      if(pe_p.value){ be.value = Math.round(parseFloat(pe_p.value) * p); }
      else if(be.value){ pe_p.value = Math.round(parseFloat(be.value) / p * 100) / 100; }
    }
  };
  be.oninput = ()=>linkFrom('budget');
  pe_p.oninput = ()=>linkFrom('perperson');
  pe.oninput = ()=>linkFrom('people');
  toggleCatMode();
  loadTplPanel();
}
function closeCatering(){
  document.getElementById('cateringModal').style.display='none';
}

function generateCatering(){
  const people = parseInt(document.getElementById('cat_people').value)||0;
  const budget = parseFloat(document.getElementById('cat_budget').value)||0;
  const perPerson = parseFloat(document.getElementById('cat_perperson').value)||null;
  const kitchenLabor = parseFloat(document.getElementById('cat_kitchen_labor').value)||0;
  const deliveryLabor = parseFloat(document.getElementById('cat_delivery_labor').value)||0;
  if(people<=0){ alert('请输入人数'); return; }
  if(perPerson===null && budget<=0){ alert('请输入总餐标或人均'); return; }

  const mode = document.querySelector('input[name=cat_mode]:checked').value;
  const body = {people, total_budget: perPerson ? perPerson*people : budget,
    kitchen_labor: kitchenLabor, delivery_labor: deliveryLabor, mode};
  if(perPerson) body.per_person = perPerson;
  if(mode === 'template'){
    const labels = {beef:1,pork:1,chicken:1,vegetable:1,side:1,sauce:1,drink:1};
    const per = {};
    Object.keys(labels).forEach(c=>{ per[c] = parseFloat(document.getElementById('tpl_'+c).value)||0; });
    const margin = parseFloat(document.getElementById('tpl_margin').value)||40;
    const mantou = parseFloat(document.getElementById('tpl_mantou').value)||1.6;
    body.template = {per_person_g: per, target_margin: margin/100, min_per_person_g: {}, per_person_unit:{'奶香小馒头':mantou}};
    body.is_setup = document.getElementById('tpl_is_setup').checked;
    body.address = document.getElementById('tpl_address').value.trim();
    body.scale_percent = parseInt(document.getElementById('tpl_scale').value)||100;
    body.include_depreciation = document.getElementById('tpl_include_dep').checked;
    const cutting = parseFloat(document.getElementById('tpl_cutting').value)||0;
    if(cutting>0) body.cutting_labor = cutting;
  }

  body.exclude_tools = [...cateringExcluded];  // 客户自带/排除的装备一并回传（两种模式都生效）
  fetch('/api/catering/suggest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)})
    .then(r=>r.json()).then(res=>{
      if(!res.ok){ alert(res.msg||'生成失败'); return; }
      cateringData = res.data;
      renderCatering(res.data);
    });
}

        <span style="font-size:10px;color:#856404">${s.extra_detail}</span>
      </div>

        <div style="font-size:12px;color:#856404">切配人工</div>
        <b style="color:#856404">¥${s.cutting_labor||0}</b>
      </div>
      <div style="background:#e8f4ff;border:1px solid #bcd4ef;padding:8px 12px;border-radius:8px">
        <div style="font-size:12px;color:#2980b9">装备租赁(库存缺口)</div>

        ${rentStr?`<div style="font-size:10px;color:#666;margin-top:2px">${rentStr}</div>`:''}
      </div>
      ${inclDep?`<div style="background:#fde8ef;border:1px solid #f5c6d6;padding:8px 12px;border-radius:8px">
        <div style="font-size:12px;color:#c0392b">装备折旧(×10%)</div>
        <b style="color:#c0392b">¥${deprec}</b>

      </div>`:''}

        <div style="font-size:12px;color:#888">总成本</div><b style="color:#c0392b">¥${s.total_cost}</b>
      </div>
      <div style="background:#fff;border:1px solid #27ae60;padding:8px 12px;border-radius:8px">
        <div style="font-size:12px;color:#888">毛利</div><b style="color:#27ae60">¥${s.margin} (${s.margin_pct}%)</b>

      <div style="background:#fff;border:1px solid ${healthColor};padding:8px 12px;border-radius:8px">

    <h4 style="color:var(--primary);margin:14px 0 8px">📋 食材清单</h4>

        <th style="text-align:center;padding:6px">份数</th>
        <th style="text-align:right;padding:6px">克数</th>
        <th style="text-align:right;padding:6px">总量</th>
        <th style="text-align:right;padding:6px">单价</th>
        <th style="text-align:right;padding:6px">小计</th>
        <th style="text-align:center;padding:6px">类型</th>
      </tr></thead>
      <tbody>${ingRows}</tbody>
    </table>
    <h4 style="color:var(--primary);margin:14px 0 8px">🔧 工具装备</h4>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#f3efe8">
        <th style="text-align:left;padding:6px">工具</th>
        <th style="text-align:right;padding:6px">需要</th>
        <th style="text-align:right;padding:6px">库存</th>
        <th style="text-align:center;padding:6px">排除</th>

      <tbody>${toolRows}</tbody>
    </table>

  `;
  document.getElementById('cat_pkgname').value = `定制${s.people}人¥${s.budget}`;
  document.getElementById('cateringSaveBox').style.display='block';
}

function toggleCateringExclude(idx, checked){
  const t = cateringData && cateringData.tools[idx];
  if(!t) return;
  if(checked) cateringExcluded.add(t.name); else cateringExcluded.delete(t.name);
  generateCatering();  // 重新生成：排除后不计入需求与租赁，成本同步重算
}

function saveCatering(){
  if(!cateringData){ alert('请先生成方案'); return; }
  const name = document.getElementById('cat_pkgname').value.trim();
  if(!name){ alert('请输入套餐名'); return; }
  const s = cateringData.summary;
  fetch('/api/catering/save',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name,
      people: s.people,
      total_budget: s.budget,
      kitchen_labor: s.kitchen_labor,
      delivery_labor: s.delivery_labor,
      ingredients: cateringData.ingredients,
      // 被排除(客户自带)的装备不写入套餐，避免带 0 用量行污染数据
      tools: cateringData.tools.filter(t=>!t.excluded)
    })})
    .then(r=>r.json()).then(res=>{
      if(!res.ok){ alert(res.msg||'保存失败'); return; }
      alert('✓ 已保存为定制套餐：'+name);
      closeCatering();
      loadMenu();  // 刷新套餐列表
    });
}

// ===== 刷新特效 =====
function refreshWithFx(fn){
  const btn = event.target.closest('.btn-refresh');
  if(btn){ btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'), 800); }
  if(typeof fn === 'function') fn();
  showRefreshToast();
}
function showRefreshToast(){
  let t = document.getElementById('refreshToast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id = 'refreshToast';
  t.className = 'refresh-toast';
  t.textContent = '✓ 已刷新';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
async function doBackup(){const b=event.target;if(!confirm('备份会先把云端已有的订单合并进来（不会丢单），再把当前数据推上去。确定现在备份？'))return;b.textContent='⏳ 备份中...';b.disabled=true;try{const r=await fetch('/api/backup',{method:'POST'});const d=await r.json();if(d.ok){b.textContent='✅ 已备份';setTimeout(()=>{b.textContent='💾 备份';b.disabled=false},2000)}else{alert(d.msg||'备份失败');b.textContent='💾 备份';b.disabled=false}}catch(e){alert('备份失败：网络错误');b.textContent='💾 备份';b.disabled=false}}
// 页面打开即自动加载菜单
// （原来这里缺少初始调用，导致菜单页打开是空白、必须手动点「刷新」才显示）
loadMenu();
autoSync(loadMenu, 60000);
</script>
