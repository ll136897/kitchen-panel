<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>财务分析 · 刘和牛备餐系统</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .fin-card{background:#fff;border:1px solid var(--border-l);border-radius:12px;padding:16px;margin:10px 0}
  .fin-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .fin-kpi-item{background:linear-gradient(135deg,#f9f5ed,#f3ebe0);border-radius:10px;padding:10px;text-align:center}
  .fin-kpi-item .lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
  .fin-kpi-item .val{font-size:18px;font-weight:800}
  .fin-kpi-item .sub{font-size:10px;color:var(--muted);margin-top:2px}
  .fin-kpi-item.positive .val{color:var(--green,#27ae60)}
  .fin-kpi-item.negative .val{color:var(--primary)}
  .fin-kpi-item.neutral .val{color:var(--accent)}
  .fin-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .fin-tbl th{background:#3a2416;color:#fff;padding:7px 6px;text-align:center;font-size:11px;position:sticky;top:0;z-index:1}
  .fin-tbl td{padding:6px 5px;border-bottom:1px solid #f0ebe3;text-align:center}
  .fin-tbl tr:hover{background:#faf5ed}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .badge-paid{background:#d4edda;color:#155724}
  .badge-unpaid{background:#f8d7da;color:#721c24}
  .badge-partial{background:#fff3cd;color:#856404}
  .badge-pending{background:#e2e3e5;color:#383d41}
  .badge-returned{background:#d1ecf1;color:#0c5460}
  .badge-forfeited{background:#f8d7da;color:#721c24}
  .select-mini{padding:3px 4px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:#fff}
  .sec-title{font-size:15px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
  .sec-title .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  /* 日期维度切换 */
  .range-tabs{display:inline-flex;background:#f3ebe0;border-radius:8px;padding:3px;gap:2px}
  .range-tab{padding:6px 14px;border:none;background:transparent;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:#6b4f3a;transition:all .15s}
  .range-tab.active{background:#3a2416;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .range-date{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}
  /* 成本管理卡 */
  .cost-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .cost-item{background:#faf6ef;border:1px solid #f0ebe3;border-radius:8px;padding:8px 10px}
  .cost-item .nm{font-size:12px;font-weight:700;color:#3a2416;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cost-item .cat{font-size:10px;color:#999;margin-bottom:4px}
  .cost-item .ref{font-size:10px;color:#27ae60;font-weight:600;margin-top:3px}
  .cost-item input{width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:5px;font-size:13px;text-align:right;font-weight:700;color:#c0392b;box-sizing:border-box}
  .cost-item input:focus{border-color:#3a2416;outline:none}
  .cost-item.saved{background:#e8f5e9;border-color:#a5d6a7}
  @media(max-width:600px){
    .fin-kpi{grid-template-columns:repeat(2,1fr)}
    .fin-kpi-item .val{font-size:16px}
    .fin-tbl{font-size:11px}
    .fin-tbl th,.fin-tbl td{padding:5px 3px}
    .cost-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  }
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-item">📊 面板</a>
  <a href="/orders" class="nav-item">📋 订单</a>
  <a href="/prep" class="nav-item">🍱 备餐</a>
  <a href="/finance" class="nav-item active">📈 财务</a>
  <a href="/menu" class="nav-item">📜 菜单</a>
  <a href="/config" class="nav-item">📦 库存</a>
  <button class="nav-item" onclick="doBackup()" style="border:none;background:none;cursor:pointer;font-size:14px;padding:6px 10px;border-radius:6px;" title="备份数据">💾 备份</button>
</nav>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;flex-wrap:wrap;gap:8px">
    <div>
      <div class="title">📈 财务分析</div>
      <div class="sub">收入·成本·毛利·押金·应收账款</div>
    </div>
    <div class="toolbar" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <div class="range-tabs">
        <button class="range-tab active" data-range="day" onclick="setRange('day')">📅 日</button>
        <button class="range-tab" data-range="week" onclick="setRange('week')">🗓️ 周</button>
        <button class="range-tab" data-range="month" onclick="setRange('month')">📊 月</button>
      </div>
      <input type="date" id="rangeDate" class="range-date" onchange="onDateChange()">
      <button class="btn btn-primary btn-sm btn-refresh" onclick="refreshWithFx(loadAll)"><span class="btn-icon">🔄</span> 刷新</button>
    </div>
  </div>

  <!-- KPI总览 -->
  <div class="fin-card">
    <div class="fin-kpi" id="kpiBox"></div>
  </div>

  <!-- 货款 + 押金 -->
  <div class="fin-card">
    <div class="fin-kpi" id="payBox"></div>
  </div>

  <!-- 订单财务明细 -->
  <div class="fin-card">
    <div class="sec-title"><span class="dot" style="background:#3a2416"></span>📋 订单财务明细</div>
    <table class="fin-tbl" id="finTable">
      <thead>
        <tr>
          <th>日期</th><th>客户</th><th>金额</th><th>食材成本</th><th>损耗</th>
          <th>毛利</th><th>毛利率</th><th>货款</th><th>押金</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 食材成本管理（改价后全局同步到所有菜单/订单） -->
  <div class="fin-card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
      <div class="sec-title" style="margin:0"><span class="dot" style="background:#c0392b"></span>💰 食材成本管理</div>
      <div style="font-size:11px;color:#888">改价后自动同步到所有菜单/订单成本</div>
    </div>
    <div style="margin:8px 0">
      <input type="text" id="costSearch" placeholder="🔍 搜索食材..." oninput="filterCostItems()" style="width:100%;max-width:240px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px">
    </div>
    <div class="cost-grid" id="costGrid"></div>
  </div>

  <!-- 成本明细弹窗 -->
  <div id="costModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:16px">
    <div class="fin-card" style="max-width:600px;width:100%;max-height:85vh;overflow:auto;margin:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">🥩 订单 <span id="costOid"></span> 成本明细</h3>
        <button class="btn btn-sm" onclick="closeCostModal()">✖</button>
      </div>
      <table class="fin-tbl" id="costTable">
        <thead><tr><th>食材</th><th>用量</th><th>单价</th><th>成本</th><th>编辑单价</th></tr></thead>
        <tbody></tbody>
      </table>
      <div style="margin-top:8px;text-align:right;font-weight:700;font-size:14px" id="costTotal"></div>
      <div style="margin-top:4px;font-size:11px;color:var(--muted)">修改单价会更新该食材的全局成本（影响所有后续订单）</div>
    </div>
  </div>
</div>

<script>
const PAY_LABEL = {paid:'已收', unpaid:'未收', partial:'部分'};
const DEP_LABEL = {pending:'待退', returned:'已退', forfeited:'扣留'};
const CAT_LABEL = {beef:'牛肉',pork:'猪肉',chicken:'鸡肉',vegetable:'素菜',side:'小菜',sauce:'小料',drink:'酒水',packaging:'包装',utensil:'餐具',staple:'主食',other:'其他'};

let currentRange = 'day'; // day / week / month

// ===== 日期范围计算 =====
function fmtDate(d){
  return d.toISOString().slice(0,10);
}
function getRangeDates(){
  const picked = document.getElementById('rangeDate').value;
  const base = picked ? new Date(picked) : new Date();
  // 防止时区偏移
  const y = base.getFullYear(), m = base.getMonth(), d = base.getDate();
  if(currentRange === 'day'){
    const day = new Date(y,m,d);
    return {from: fmtDate(day), to: fmtDate(day)};
  } else if(currentRange === 'week'){
    // 周一到周日
    const dow = base.getDay() || 7;
    const monday = new Date(y,m,d - dow + 1);
    const sunday = new Date(y,m,d - dow + 7);
    return {from: fmtDate(monday), to: fmtDate(sunday)};
  } else { // month
    const first = new Date(y,m,1);
    const last = new Date(y,m+1,0);
    return {from: fmtDate(first), to: fmtDate(last)};
  }
}
function setRange(r){
  currentRange = r;
  document.querySelectorAll('.range-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.range === r);
  });
  loadAll();
}
function onDateChange(){
  loadAll();
}
// 初始化日期为今天
document.getElementById('rangeDate').value = fmtDate(new Date());

// 带自动重试的取数：Render 免费实例休眠后冷启动，首次请求可能失败/超时，
// 自动重试可避免"页面空白、要手动刷新"。
async function fetchJSONRetry(url, tries){
  tries = tries || 4;
  for(let i=1;i<=tries;i++){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(r.ok) return await r.json();
    }catch(e){ /* 网络失败：继续重试 */ }
    if(i < tries) await new Promise(s=>setTimeout(s, 1200));
  }
  return null;
}

function loadAll(){
  const r = getRangeDates();
  const qs = `date_from=${r.from}&date_to=${r.to}`;
  Promise.all([
    fetchJSONRetry('/api/finance/summary?'+qs),
    fetchJSONRetry('/api/finance/orders?'+qs)
  ]).then(([sumRes, ordRes])=>{
    if(!sumRes || !ordRes){
      const box = document.getElementById('kpiBox');
      if(box) box.innerHTML = '<div class="muted" style="padding:24px;text-align:center">'+
        '⚠️ 数据加载失败（网络异常或系统正在启动）<br><br>'+
        '<button class="btn btn-primary btn-sm" onclick="loadAll()">🔄 重新加载</button></div>';
      return;
    }
    renderKpi(sumRes.data||{});
    renderOrders(ordRes.data||[]);
  });
  loadCostItems();
}

function fmtY(n){
  n = n || 0;
  return '¥' + (Math.abs(n) < 100 ? n.toFixed(1) : Math.round(n).toLocaleString());
}

function renderKpi(s){
  document.getElementById('kpiBox').innerHTML = `
    <div class="fin-kpi-item positive">
      <div class="lbl">💰 总收入</div>
      <div class="val">${fmtY(s.total_revenue)}</div>
      <div class="sub">${s.order_cnt||0}单</div>
    </div>
    <div class="fin-kpi-item negative">
      <div class="lbl">🥬 食材成本</div>
      <div class="val">${fmtY(s.food_cost)}</div>
      <div class="sub">含摆盘损耗</div>
    </div>
    <div class="fin-kpi-item negative">
      <div class="lbl">🔧 工具损耗</div>
      <div class="val">${fmtY(s.tool_loss_cost)}</div>
      <div class="sub">丢失/损坏</div>
    </div>
    <div class="fin-kpi-item positive">
      <div class="lbl">📊 毛利</div>
      <div class="val">${fmtY(s.gross_profit)}</div>
      <div class="sub">毛利率 ${s.margin||0}%</div>
    </div>
    <div class="fin-kpi-item neutral">
      <div class="lbl">📦 库存价值</div>
      <div class="val">${fmtY(s.stock_value)}</div>
      <div class="sub">食材库存</div>
    </div>
    <div class="fin-kpi-item neutral">
      <div class="lbl">🚚 配送费收入</div>
      <div class="val">${fmtY(s.delivery_revenue)}</div>
      <div class="sub">含在总价内</div>
    </div>
  `;
  document.getElementById('payBox').innerHTML = `
    <div class="fin-kpi-item positive">
      <div class="lbl">✅ 已收货款</div>
      <div class="val">${fmtY(s.paid_amount)}</div>
    </div>
    <div class="fin-kpi-item negative">
      <div class="lbl">❌ 未收货款</div>
      <div class="val">${fmtY(s.unpaid_amount)}</div>
      <div class="sub">应收账款</div>
    </div>
    <div class="fin-kpi-item neutral">
      <div class="lbl">⏳ 部分收款</div>
      <div class="val">${fmtY(s.partial_amount)}</div>
    </div>
    <div class="fin-kpi-item negative">
      <div class="lbl">🔒 待退押金</div>
      <div class="val">${fmtY(s.deposit_pending)}</div>
    </div>
    <div class="fin-kpi-item positive">
      <div class="lbl">✅ 已退押金</div>
      <div class="val">${fmtY(s.deposit_returned)}</div>
    </div>
    <div class="fin-kpi-item neutral">
      <div class="lbl">⛔ 扣留押金</div>
      <div class="val">${fmtY(s.deposit_forfeited)}</div>
    </div>
  `;
}

function renderOrders(orders){
  const tb = document.querySelector('#finTable tbody');
  if(!orders.length){
    tb.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:20px">暂无订单数据</td></tr>';
    return;
  }
  tb.innerHTML = orders.map(o=>{
    const profitColor = o.profit > 0 ? 'var(--green,#27ae60)' : 'var(--primary)';
    const payBadge = `<span class="badge badge-${o.payment_status}">${PAY_LABEL[o.payment_status]||o.payment_status}</span>`;
    const depBadge = `<span class="badge badge-${o.deposit_status}">${DEP_LABEL[o.deposit_status]||o.deposit_status}</span>`;
    return `<tr>
      <td>${(o.booking_date||'').slice(5)}</td>
      <td style="text-align:left">${o.contact_name||'-'}</td>
      <td>${fmtY(o.amount)}</td>
      <td><a href="javascript:void(0)" onclick="showCostDetail(${o.id})" style="color:#c0392b;font-weight:600">${fmtY(o.food_cost)}</a></td>
      <td>${fmtY(o.tool_loss)}</td>
      <td style="color:${profitColor};font-weight:700">${fmtY(o.profit)}</td>
      <td style="font-weight:600">${o.margin_pct}%</td>
      <td>
        <select class="select-mini" onchange="setPay(${o.id}, this.value)">
          <option value="unpaid" ${o.payment_status==='unpaid'?'selected':''}>未收</option>
          <option value="partial" ${o.payment_status==='partial'?'selected':''}>部分</option>
          <option value="paid" ${o.payment_status==='paid'?'selected':''}>已收</option>
        </select>
      </td>
      <td>
        <select class="select-mini" onchange="setDep(${o.id}, this.value)">
          <option value="pending" ${o.deposit_status==='pending'?'selected':''}>待退</option>
          <option value="returned" ${o.deposit_status==='returned'?'selected':''}>已退</option>
          <option value="forfeited" ${o.deposit_status==='forfeited'?'selected':''}>扣留</option>
        </select>
      </td>
      <td><button class="btn btn-sm" onclick="showCostDetail(${o.id})" style="font-size:10px;padding:2px 6px">明细</button></td>
    </tr>`;
  }).join('');
}

function setPay(oid, status){
  fetch(`/api/finance/payment/${oid}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({payment_status: status})
  }).then(()=>showRefreshToast());
}
function setDep(oid, status){
  fetch(`/api/finance/deposit/${oid}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({deposit_status: status})
  }).then(()=>showRefreshToast());
}

// ===== 成本明细弹窗 =====
function showCostDetail(oid){
  document.getElementById('costOid').textContent = '#' + oid;
  const modal = document.getElementById('costModal');
  modal.style.display = 'flex';
  fetch(`/api/finance/order/${oid}/cost-detail`).then(r=>r.json()).then(d=>{
    const items = d.data||[];
    let total = 0;
    const html = items.map(i=>{
      total += i.total_cost;
      return `<tr>
        <td style="text-align:left">${i.name}</td>
        <td>${i.total_amount}${i.unit}</td>
        <td>¥${i.unit_cost}</td>
        <td style="font-weight:700;color:#c0392b">¥${i.total_cost.toFixed(2)}</td>
        <td>
          <input type="number" class="select-mini" style="width:70px" value="${i.unit_cost}" step="0.01"
            onchange="editIngCost(${i.ingredient_id}, this.value)" id="edit-cost-${i.ingredient_id}">
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="5" class="muted" style="text-align:center">无成本数据</td></tr>';
    document.querySelector('#costTable tbody').innerHTML = html;
    document.getElementById('costTotal').innerHTML = `食材成本合计: <span style="color:#c0392b">¥${total.toFixed(2)}</span>`;
  });
}

function closeCostModal(){
  document.getElementById('costModal').style.display = 'none';
}

function editIngCost(iid, val){
  fetch(`/api/ingredients/${iid}/cost`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cost:parseFloat(val||0),item_type:'ingredient'})})
    .then(r=>r.json()).then(()=>{
      showRefreshToast();
      loadCostItems(); // 同步成本管理卡
    });
}

// ===== 食材成本管理 =====
let allCostItems = [];
function loadCostItems(){
  fetchJSONRetry('/api/ingredients').then(d=>{
    if(!d || !d.ok) return;   // 失败时静默，避免干扰主财务数据展示
    allCostItems = (d.data||[]).filter(i=>i.category !== 'packaging' && i.category !== 'utensil');
    const order = ['beef','pork','chicken','staple','vegetable','side','sauce','drink','other'];
    allCostItems.sort((a,b)=>{
      const ia = order.indexOf(a.category), ib = order.indexOf(b.category);
      if(ia!==ib) return ia-ib;
      return a.name.localeCompare(b.name,'zh');
    });
    renderCostItems(allCostItems);
  });
}
function renderCostItems(items){
  const grid = document.getElementById('costGrid');
  if(!items.length){
    grid.innerHTML = '<div class="muted" style="padding:20px">暂无食材</div>';
    return;
  }
  grid.innerHTML = items.map(i=>{
    const ref = costRefText(i.cost, i.unit);
    return `<div class="cost-item" id="costItem-${i.id}">
      <div class="nm">${i.name}</div>
      <div class="cat">${CAT_LABEL[i.category]||i.category} · ${i.unit}</div>
      <input type="number" value="${i.cost||0}" step="0.001" min="0"
        onchange="saveCost(${i.id}, this.value, '${i.unit}')"
        oninput="liveRef(this, '${i.unit}', ${i.id})">
      <div class="ref" id="costRef-${i.id}">${ref}</div>
    </div>`;
  }).join('');
}
function filterCostItems(){
  const kw = document.getElementById('costSearch').value.trim().toLowerCase();
  if(!kw){ renderCostItems(allCostItems); return; }
  renderCostItems(allCostItems.filter(i=>i.name.toLowerCase().includes(kw)));
}
function costRefText(cost, unit){
  const c = parseFloat(cost||0);
  if(!c) return '';
  if(unit==='g') return `≈ ¥${(c*1000).toFixed(c>=0.1?0:1)}/kg`;
  if(unit==='ml') return `≈ ¥${(c*1000).toFixed(c>=0.01?0:1)}/L`;
  if(unit==='份') return `≈ ¥${(c*2).toFixed(1)}/盒(2份)`;
  if(unit==='个') return `≈ ¥${(c*60).toFixed(0)}/袋(60个)`;
  return '';
}
function liveRef(input, unit, id){
  const el = document.getElementById('costRef-'+id);
  if(el) el.textContent = costRefText(input.value, unit);
}
function saveCost(iid, val, unit){
  const c = parseFloat(val||0);
  fetch(`/api/ingredients/${iid}/cost`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cost:c,item_type:'ingredient'})})
    .then(r=>r.json()).then(()=>{
      const item = document.getElementById('costItem-'+iid);
      if(item){ item.classList.add('saved'); setTimeout(()=>item.classList.remove('saved'), 1200); }
      showRefreshToast();
      // 刷新财务总览和订单（成本变化影响毛利）
      const r = getRangeDates();
      fetch('/api/finance/summary?date_from='+r.from+'&date_to='+r.to).then(x=>x.json()).then(d=>renderKpi(d.data||{}));
      fetch('/api/finance/orders?date_from='+r.from+'&date_to='+r.to).then(x=>x.json()).then(d=>renderOrders(d.data||[]));
    });
}

loadAll();

// ===== 刷新特效 =====
function refreshWithFx(fn){
  const btn = event.target.closest('.btn-refresh');
  if(btn){ btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'), 800); }
  if(typeof fn === 'function') fn();
  showRefreshToast();
}
function showRefreshToast(){
  let t = document.getElementById('refreshToast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id = 'refreshToast';
  t.className = 'refresh-toast';
  t.textContent = '✓ 已刷新';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
async function doBackup(){const b=event.target;b.textContent='⏳ 备份中...';b.disabled=true;try{const r=await fetch('/api/backup',{method:'POST'});const d=await r.json();if(d.ok){b.textContent='✅ 已备份';setTimeout(()=>{b.textContent='💾 备份';b.disabled=false},2000)}else{alert(d.msg||'备份失败');b.textContent='💾 备份';b.disabled=false}}catch(e){alert('备份失败：网络错误');b.textContent='💾 备份';b.disabled=false}}
</script>
