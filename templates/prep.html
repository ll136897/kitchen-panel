<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>备餐合并 · 刘和牛户外烤肉</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* ===== 备餐表 · 移动端加大字体 + 5列网格 ===== */
  .urg-overdue{color:#fff;background:var(--red);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:700}
  .urg-soon{color:#fff;background:var(--orange);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:700}
  .urg-normal{color:#fff;background:var(--green);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:700}
  .urg-past{color:#fff;background:#6b4f3a;padding:3px 10px;border-radius:10px;font-size:13px;font-weight:700}
  .urg-future{color:#fff;background:var(--blue);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:700}

  /* 分类卡片：每个分类一个独立块，用不同背景色分隔 */
  .cat-block{
    border-radius:12px;
    overflow:hidden;
    margin:10px 0;
    border:1px solid var(--border-l);
  }
  .cat-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;
    font-size:17px;font-weight:700;
    color:#fff;
  }
  .cat-head .cat-count{
    font-size:13px;font-weight:600;opacity:.9;
    background:rgba(255,255,255,.25);padding:2px 10px;border-radius:10px;
  }
  .cat-head .check-all-btn{
    font-size:13px;padding:4px 12px;border-radius:8px;
    border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);
    color:#fff;cursor:pointer;font-weight:700;
  }
  .cat-head .check-all-btn:hover{background:rgba(255,255,255,.3)}

  /* 7列网格：勾选 | 名字 | 份数 | 克数 | 单位 | 总量 | 状态 */
  .prep-row{
    display:grid;
    grid-template-columns:28px 1fr 46px 52px 40px 58px 72px;
    gap:5px;
    align-items:center;
    padding:10px 10px;
    border-bottom:1px solid rgba(0,0,0,.06);
    transition:background .12s;
    min-width:0;
  }
  .prep-row:last-child{border-bottom:none}
  .prep-row:hover{filter:brightness(.97)}
  .prep-row.checked{opacity:.55}
  .prep-row.checked .pr-name{text-decoration:line-through;color:#888}

  /* 表头行 */
  .prep-header{
    display:grid;
    grid-template-columns:28px 1fr 46px 52px 40px 58px 72px;
    gap:5px;
    padding:7px 10px;
    font-size:12px;font-weight:700;color:#666;
    background:rgba(0,0,0,.05);
    border-bottom:2px solid rgba(0,0,0,.08);
    min-width:0;
  }
  .prep-header > div{text-align:center;min-width:0}
  .prep-header > div:nth-child(2){text-align:left}

  .prep-row input[type=checkbox]{
    width:22px;height:22px;accent-color:var(--green);cursor:pointer;
  }
  .pr-name{font-size:15px;font-weight:700;line-height:1.3;word-break:break-all;min-width:0}
  .pr-ord{font-size:14px;color:#555;text-align:center;font-weight:600}
  .pr-per{font-size:13px;color:#444;text-align:center;font-weight:600}
  .pr-unit{font-size:13px;color:#666;text-align:center;font-weight:600}
  .pr-total{font-size:16px;color:var(--primary);text-align:right;font-weight:800;font-family:"DIN","Helvetica Neue",sans-serif}
  .pr-short{font-size:11px;text-align:right;font-weight:700;line-height:1.2}
  .pr-short.ok{color:var(--green)}
  .pr-short:not(.ok){color:var(--red)}

  /* 分类配色：每类用不同色背景避免错行 */
  .cat-beef     .cat-head{background:#8e1e1a}              /* 牛肉·深红 */
  .cat-beef     .prep-row{background:#fbeae9}
  .cat-beef     .prep-row:nth-child(odd){background:#f7e0de}

  .cat-pork     .cat-head{background:#c75d3e}              /* 猪肉·橙红 */
  .cat-pork     .prep-row{background:#fdedea}
  .cat-pork     .prep-row:nth-child(odd){background:#fae3dd}

  .cat-chicken  .cat-head{background:#c9962b}              /* 鸡肉·金黄 */
  .cat-chicken  .prep-row{background:#fdf3da}
  .cat-chicken  .prep-row:nth-child(odd){background:#fbeed0}

  .cat-vegetable .cat-head{background:#3a8a3a}             /* 蔬菜·绿 */
  .cat-vegetable .prep-row{background:#e7f5e7}
  .cat-vegetable .prep-row:nth-child(odd){background:#def0de}

  .cat-side     .cat-head{background:#5a8a3a}              /* 小菜·浅绿 */
  .cat-side     .prep-row{background:#eef5e8}
  .cat-side     .prep-row:nth-child(odd){background:#e4f0de}

  .cat-sauce    .cat-head{background:#7a5a3a}              /* 小料·棕 */
  .cat-sauce    .prep-row{background:#f3ecdf}
  .cat-sauce    .prep-row:nth-child(odd){background:#ede3d0}

  .cat-drink    .cat-head{background:#666}                 /* 赠品·灰 */
  .cat-drink    .prep-row{background:#eee}
  .cat-drink    .prep-row:nth-child(odd){background:#e6e6e6}

  .cat-staple   .cat-head{background:#888}                 /* 主食·深灰 */
  .cat-staple   .prep-row{background:#f0f0f0}
  .cat-staple   .prep-row:nth-child(odd){background:#e8e8e8}

  .cat-other    .cat-head{background:#666}                 /* 其他·灰 */
  .cat-other    .prep-row{background:#eee}
  .cat-other    .prep-row:nth-child(odd){background:#e6e6e6}

  .cat-packaging .cat-head{background:#d35400}             /* 食材包装·橙棕 */
  .cat-packaging .prep-row{background:#fbeee5}
  .cat-packaging .prep-row:nth-child(odd){background:#f5e0d2}

  .cat-tableware .cat-head,.cat-utensil .cat-head{background:#8e44ad}      /* 客户餐具·紫 */
  .cat-tableware .prep-row,.cat-utensil .prep-row{background:#f1e9f4}
  .cat-tableware .prep-row:nth-child(odd),.cat-utensil .prep-row:nth-child(odd){background:#ebdff0}

  .cat-tool     .cat-head{background:#4a4a4a}              /* 工具·深灰 */
  .cat-tool     .prep-row{background:#ededed}
  .cat-tool     .prep-row:nth-child(odd){background:#e4e4e4}

  /* 手机端：7列压缩，确保不溢出、不需滑动 */
  @media(max-width:600px){
    .prep-row,.prep-header{
      grid-template-columns:24px 1fr 32px 38px 28px 46px 56px;
      gap:3px;padding:8px 6px;
    }
    .prep-header{padding:5px 6px;font-size:10px}
    .pr-name{font-size:13px;line-height:1.2}
    .pr-ord{font-size:12px}
    .pr-per{font-size:11px}
    .pr-unit{font-size:10px}
    .pr-total{font-size:14px}
    .pr-short{font-size:10px}
    .prep-row input[type=checkbox]{width:20px;height:20px}
    .cat-head{padding:7px 8px;font-size:14px}
    .cat-head .cat-count{font-size:10px;padding:1px 6px}
    .cat-head .check-all-btn{font-size:10px;padding:3px 7px}
  }

  /* ===== 订单卡 · 自适应换行版 =====
     目标：任何手机宽度都完整显示，绝不横向溢出、无需左右滑动。
     信息顺序：地点 → 日期 → 时间 → 套餐 → 联系人 → 备注（装不下就自动折到下一行） */
  .orow{
    display:flex;
    flex-wrap:wrap;              /* 关键：装不下自动换行，而不是撑宽 */
    align-items:center;
    gap:3px 12px;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid var(--border-l);
    border-left:4px solid var(--accent);   /* 左侧色条，视觉锚点 */
    background:#fff;
    margin-bottom:8px;
    overflow:hidden;             /* 双保险：绝不出现横向滚动条 */
  }
  .orow>span{
    font-size:13.5px;
    line-height:1.5;
    min-width:0;
    max-width:100%;
    white-space:normal;          /* 允许内部换行 */
    overflow-wrap:anywhere;
  }
  .c-addr{font-weight:700;color:#2b1e14}
  .c-date{color:#6b5b4a;white-space:nowrap}
  .c-time{font-weight:800;font-size:15px;color:#c0392b;white-space:nowrap}
  .c-pkg{color:#2b1e14}
  .c-name{color:#2b1e14}
  .c-note{
    flex:1 1 100%;               /* 备注独占一行，完整显示不截断 */
    margin-top:2px;
    padding:3px 8px;
    border-radius:6px;
    background:#faf5ed;
    color:#8a7a68;
  }
  .order-mini{display:inline-flex;align-items:center;gap:6px;background:#faf5ed;padding:8px 12px;border-radius:10px;margin:4px;border:1px solid var(--border-l);font-size:14px}
  .date-picker{padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px}
  /* 日期快捷按钮条：列出所有有备餐订单的日期 */
  .date-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .date-chip{
    padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700;
    border:1px solid var(--border-l);background:#fff;color:#5a4a3a;cursor:pointer;
    transition:all .12s;display:inline-flex;align-items:center;gap:5px;
  }
  .date-chip:hover{background:#faf5ed}
  .date-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .date-chip.today{border-color:var(--green);color:var(--green)}
  .date-chip.today.active{background:var(--green);color:#fff;border-color:var(--green)}
  .date-chip.past{opacity:.7;border-style:dashed}
  .date-chip .chip-cnt{
    background:rgba(0,0,0,.1);padding:1px 7px;border-radius:8px;font-size:12px;
  }
  .date-chip.active .chip-cnt{background:rgba(255,255,255,.3)}
  .date-chip.active .muted{color:rgba(255,255,255,.85)}
  .mode-tab{display:inline-flex;background:#f3efe8;padding:3px;border-radius:12px;gap:2px}
  .mode-tab button{padding:10px 18px;border:none;background:transparent;color:#8a7f75;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
  .mode-tab button.active{background:var(--primary);color:#fff}
  /* 套餐分类 chips */
  .pkg-scope{padding:6px 12px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border);
    background:#fff;color:#5a4a3a;cursor:pointer;line-height:1}
  .pkg-scope.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .pkg-chip{padding:7px 12px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border);
    background:#fff;color:#5a4a3a;cursor:pointer;line-height:1;display:inline-flex;align-items:center;gap:4px}
  .pkg-chip .n{color:var(--primary);font-weight:800}
  .pkg-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .pkg-chip.active .n{color:#fff}
  #pkgDetail .pd-row{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f0ebe3;font-size:13px;flex-wrap:wrap}
  @media(max-width:600px){ .pkg-chip{padding:6px 10px;font-size:12px} .pkg-scope{padding:5px 10px;font-size:12px} }
  .sec-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .muted{color:var(--muted)}

  /* 顶部摘要条 */
  .summary-bar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  }
  .summary-chip{
    background:#fff;border:1px solid var(--border-l);border-radius:10px;
    padding:8px 12px;font-size:14px;
  }
  .summary-chip b{color:var(--primary);font-size:16px}

  /* 备餐保活：手机上只占一个小胶囊（圆点+分钟数），详细说明只在电脑端显示 */
  .ka-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:14px;
    border:1px solid var(--border);background:#fff;color:#8a7364;font-size:12px;font-weight:700;
    cursor:pointer;line-height:1;flex:0 0 auto}
  .ka-dot{width:8px;height:8px;border-radius:50%;background:#c9c2b8;flex:0 0 auto}
  .ka-chip.on{background:#eaf7ee;border-color:#a5d6a7;color:#1b7a43}
  .ka-chip.on .ka-dot{background:#27ae60;animation:kapulse 2s ease-in-out infinite}
  .ka-chip.err{background:#fdecea;border-color:#e8a9a3;color:#b3261e}
  .ka-chip.err .ka-dot{background:#c0392b;animation:none}
  @keyframes kapulse{0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.5)}50%{box-shadow:0 0 0 4px rgba(39,174,96,0)}}
  .ka-stat{font-size:11px;color:var(--muted);line-height:1.3;flex:0 1 auto;min-width:0}
  .ka-stat.on{color:#1b7a43;font-weight:600}
  .ka-stat.err{color:#b3261e;font-weight:600}
  /* 系统正在启动：一行、小字，别占屏幕 */
  .wake-banner{display:none;align-items:center;gap:6px;flex-wrap:nowrap;
    background:#fff4e5;border:1px solid #f0c98a;color:#8a4b00;border-radius:9px;
    padding:6px 10px;font-size:12.5px;font-weight:600;margin:0 0 8px}
  .wake-banner.on{display:flex}
  .wake-banner #wakeTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wake-spin{display:inline-block;width:11px;height:11px;border:2px solid #e0a94f;
    border-top-color:#8a4b00;border-radius:50%;animation:wkspin .8s linear infinite;flex:0 0 auto}
  @keyframes wkspin{to{transform:rotate(360deg)}}
  @media(max-width:600px){
    /* 手机端：说明文字一律藏起来，只留颜色和数字；页面副标题也收掉，把屏幕留给清单 */
    .ka-stat{display:none}
    .prep-sub{display:none}
    .ord-hint{display:none}
  }
  /* 订单行：点一下看"这一单具体要备什么菜" */
  .orow{cursor:pointer}
  .orow::after{content:'›';color:var(--muted);font-weight:700;margin-left:auto;font-size:16px;line-height:1}
  .ord-hint{font-size:12px;color:var(--muted);margin:-4px 0 8px}
  /* 这一单的菜（手机=底部抽屉，电脑=居中弹窗） */
  .os-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
  .os-mask.on{display:block}
  .os-sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;
    border-radius:16px 16px 0 0;max-height:84vh;flex-direction:column;
    box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  .os-sheet.on{display:flex}
  .os-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--border)}
  .os-title{font-weight:700;font-size:15px;flex:1;min-width:0;line-height:1.4}
  .os-close{border:none;background:#f1f1f1;border-radius:50%;width:30px;height:30px;
    font-size:14px;line-height:1;cursor:pointer;flex:0 0 auto}
  .os-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 12px;flex:1}
  .os-foot{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border)}
  .os-btn{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:14px;
    border:1px solid var(--border);cursor:pointer}
  .os-btn.primary{background:#27ae60;color:#fff;border-color:#27ae60}
  .os-btn.ghost{background:#fff}
  .os-sum{font-size:13px;color:var(--muted);line-height:1.7}
  .os-pack{font-size:14px;font-weight:700;margin:6px 0 4px}
  .os-note{font-size:13px;color:#8a4b00;background:#fff8ec;border-radius:8px;padding:6px 9px;margin:6px 0}
  .os-cat{font-size:13px;font-weight:700;margin:12px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--border)}
  .os-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed #eee}
  .os-row .nm{min-width:0;word-break:break-all}
  .os-row .qt{color:#c0392b;font-weight:700;white-space:nowrap}
  .os-row .qt .qt2{color:#8a8a8a;font-weight:600;font-size:12px;margin-left:5px}
  .os-row .short{color:#b3261e;font-size:12px}
  @media(min-width:601px){
    .os-sheet{left:50%;right:auto;transform:translateX(-50%);width:560px;bottom:auto;top:8vh;
      border-radius:14px;max-height:80vh}
  }
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-item">📊 面板</a>
  <a href="/orders" class="nav-item">📋 订单</a>
  <a href="/prep" class="nav-item active">🍱 备餐</a>
  <a href="/finance" class="nav-item">📈 财务</a>
  <a href="/menu" class="nav-item">📜 菜单</a>
  <a href="/config" class="nav-item">📦 库存</a>
  <button class="nav-item" onclick="doBackup()" style="border:none;background:none;cursor:pointer;font-size:14px;padding:6px 10px;border-radius:6px;" title="备份数据">💾 备份</button>
</nav>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;flex-wrap:wrap;gap:8px">
    <div>
      <div class="title"><span class="fire">🍱</span>备餐合并</div>
      <div class="sub prep-sub">当天多订单食材汇总给后厨 · 工具装备给装配师傅 · 餐具逐项核对</div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <input type="date" id="datePick" class="date-picker" onchange="onDatePicked()">
      <button class="btn btn-primary btn-sm btn-refresh" onclick="refreshWithFx(function(){loadPrepDates(false);loadPrep()})"><span class="btn-icon">🔄</span> 刷新</button>
      <button class="btn btn-accent btn-sm" onclick="window.open('/api/print/menu','_blank')">🖨️ 打印 / 导出</button>
      <!-- 备餐保活：一个小胶囊。灰=关，绿=正在保活（数字=已保活分钟），红=连不上。
           详细说明只在电脑端显示（手机端只看颜色和数字），点一下开关。 -->
      <button id="kaBtn" class="ka-chip" onclick="toggleKeepAlive()"
        title="备餐保活：防手机自动锁屏 + 每5分钟给系统发心跳，避免它休眠（点一下开关）">
        <span class="ka-dot"></span><span id="kaNum">保活</span>
      </button>
      <span class="ka-stat" id="kaStat"></span>
    </div>
  </div>

  <!-- 系统唤醒提示（冷启动时显示，避免以为是卡死） -->
  <div class="wake-banner" id="wakeBanner">
    <span class="wake-spin"></span>
    <span id="wakeTxt">系统启动中…</span>
  </div>

  <!-- 备餐保活：防手机锁屏 + 每 5 分钟给系统发心跳，避免它休眠 -->
  <!-- 有备餐订单的日期快捷切换条 -->
  <div class="date-chips" id="dateChips"></div>

  <!-- 用的是"上次缓存的数据"时在这里说明（系统唤醒期间也能先干活） -->
  <div id="prepStale" style="font-size:12px;color:#8a4b00;font-weight:600;margin:-4px 0 10px"></div>

  <!-- 按套餐分类：当天/本周/本月/全部 各有多少个几人餐（点套餐看是哪几单） -->
  <div class="card" id="pkgCard" style="margin-bottom:14px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div style="font-weight:800;font-size:14px">🍱 按套餐看</div>
      <span style="display:inline-flex;gap:6px;flex-wrap:wrap">
        <button class="pkg-scope active" data-pscope="day"   onclick="setPkgScope('day')">当天</button>
        <button class="pkg-scope" data-pscope="week"  onclick="setPkgScope('week')">本周</button>
        <button class="pkg-scope" data-pscope="month" onclick="setPkgScope('month')">本月</button>
        <button class="pkg-scope" data-pscope="all"   onclick="setPkgScope('all')">全部</button>
      </span>
    </div>
    <div id="pkgChips" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
    <div id="pkgSummary" class="muted" style="font-size:12px;margin-top:6px"></div>
    <div id="pkgDetail" style="margin-top:8px"></div>
  </div>

  <!-- 模式切换 -->
  <div class="mode-tab" style="margin-bottom:14px">
    <button id="tabMerged" class="active" onclick="switchMode('merged')">🔀 合并视图</button>
    <button id="tabOrder" onclick="switchMode('order')">📋 按订单</button>
  </div>

  <!-- 今日订单概览 -->
  <div class="card" id="ordersCard">

<script>
// 备餐分类顺序（与菜单页/后端 CATEGORY_ORDER 一致）：
// 牛肉→猪肉→鸡肉→素菜→小菜→小料→赠品→食材包装→客户餐具→主食→其他→工具
const CAT_LABEL = {
  beef:'🥩 牛肉', pork:'🥓 猪肉', chicken:'🍗 鸡肉',
  vegetable:'🥬 素菜', side:'🥗 小菜', sauce:'🧂 小料', drink:'🎁 赠品',
  packaging:'📦 食材包装', utensil:'🍱 客户餐具',
  staple:'🍚 主食', other:'📦 其他', tool:'🔧 工具'
};
const CAT_ORDER = ['beef','pork','chicken','vegetable','side','sauce','drink','packaging','utensil','staple','other','tool'];
// 固定排序顺序（与后端 INGREDIENT_FIXED_ORDER 一致）
const FIXED_ORDER = [
  ['beef','肥牛'],['beef','拌牛肉'],['beef','牛肋条'],['beef','牛骰子'],['beef','小肠'],
  ['pork','五花肉'],['pork','小香猪'],['pork','松板肉'],['pork','风味肠'],['pork','梅花肉'],
  ['chicken','鸡尖'],['chicken','郡肝'],['chicken','鸡腿肉'],['chicken','鸡翅根'],['chicken','掌中宝'],['chicken','鸡脚筋'],
  ['vegetable','生菜'],['vegetable','豆腐'],['vegetable','西葫芦'],['vegetable','土豆'],['vegetable','馒头'],['vegetable','韭菜'],['vegetable','杏鲍菇'],['vegetable','洋葱'],
  ['side','海带丝'],['side','辣椒段'],['side','辣白菜'],['side','蒜片'],
  ['sauce','川香'],['sauce','五香'],['sauce','酸辣'],
  ['drink','应季水果'],['drink','可乐'],['drink','雪碧'],
];
function getFixedIdx(name, cat){
  for(let i=0;i<FIXED_ORDER.length;i++){
    if(FIXED_ORDER[i][0]===cat && (name||'').includes(FIXED_ORDER[i][1])) return i;
  }
  return 999;
}
let prepData = null;
let currentMode = 'merged';
let prepDates = [];
let todayOverride = null;  // 后端返回的"今天"（北京时间），覆盖浏览器时区
let todayDateStr = '';      // 后端返回的今天日期，供各函数共用
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
function weekdayOf(s){ return WEEKDAYS[new Date(s+'T00:00:00Z').getUTCDay()]; }
function mdOf(s){ const p=s.split('-'); return `${parseInt(p[1],10)}.${parseInt(p[2],10)}`; }
function dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/86400000); }
// 本地"今天"（注意：不能用 toISOString——那是 UTC，北京的 0-8 点会算成昨天）
function localToday(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
// 出餐时间：订单时间与用餐时间视为同一个，只取一个显示（用餐 > 预约 > 收餐）
function orderTimeOf(o){ return ((o&&(o.meal_time||o.booking_time||o.pickup_time))||'').trim(); }

// 用浏览器本地日期做初始值（仅占位，loadPrepDates 会按后端"今天"修正）
document.getElementById('datePick').value = localToday();

// 用户在日期选择器里换了日期 → 必须重新取数（以前这里没接事件，选了日期页面没反应）
function onDatePicked(){
  const d = document.getElementById('datePick').value;
  if(!d) return;
  if(typeof showToast === 'function') showToast('📅 已切到 ' + mdOf(d));
  loadPrep();
}

function switchMode(mode){
  if(typeof closeOrderSheet === 'function') closeOrderSheet();
  currentMode = mode;
  document.getElementById('tabMerged').classList.toggle('active', mode==='merged');
  document.getElementById('tabOrder').classList.toggle('active', mode==='order');
  render();
}

// ===== 取数：Render 免费实例休眠后冷启动要 30-60 秒 =====
// 原来只重试 4 次 × 1.2 秒（约 5 秒）就放弃 → 冷启动必然"加载失败"。
// 现在给足耐心（默认约 100 秒），并在等待时明确告诉用户"系统正在启动"。
let _wakeTimer = null, _wakeSec = 0;
function showWake(){
  if(_wakeSec < 3) return;      // 普通慢请求（1-2 秒）不闪这个提示
  const b = document.getElementById('wakeBanner');
  const t = document.getElementById('wakeTxt');
  if(!b) return;
  b.classList.add('on');
  if(t) t.textContent = '系统启动中 ' + _wakeSec + 's…（会自动恢复，别关页面）';
}
function hideWake(){
  _wakeSec = 0;
  if(_wakeTimer){ clearInterval(_wakeTimer); _wakeTimer = null; }
  const b = document.getElementById('wakeBanner');
  if(b) b.classList.remove('on');
}
// 同一个地址只保留一个在飞的请求（避免 60 秒轮询和手点刷新叠在一起）
const _inflight = {};
async function fetchJSONRetry(url, tries, gapMs){
  if(_inflight[url]) return _inflight[url];
  tries = tries || 40;        // 40 × 2.5s ≈ 100 秒，足够覆盖冷启动
  gapMs = gapMs || 2500;
  _inflight[url] = (async function(){
    try{
      if(!_wakeTimer){ _wakeTimer = setInterval(()=>{ _wakeSec++; showWake(); }, 1000); }
      for(let i=1;i<=tries;i++){
        try{
          const r = await fetch(url, {cache:'no-store'});
          if(r.ok){ hideWake(); return await r.json(); }
        }catch(e){ /* 网络还没通：继续等 */ }
        if(i*gapMs >= 3000 && _wakeSec === 0) showWake();
        if(i < tries) await new Promise(s=>setTimeout(s, gapMs));
      }
      hideWake();
      return null;
    } finally {
      delete _inflight[url];
    }
  })();
  return _inflight[url];
}

// ===== 备餐保活：防手机锁屏 + 每 5 分钟给系统发心跳（关键是别让 Render 实例休眠）=====
// 只打 /api/ping（极轻量、不碰数据库）。注意别打 /robots.txt——服务睡着时
// Render 会自己拦截那个路径，请求到不了应用、也就唤不醒它。
const KA_KEY = 'ka_keepalive_on';
const KA_WINDOW = [8, 24];     // 与 GitHub 定时保活一致：北京 08:00-23:59，避开凌晨省额度
let _kaTimer = null, _kaStart = 0, _kaLock = null;

function kaInServiceWindow(){
  const h = new Date().getHours();
  return h >= KA_WINDOW[0] && h < KA_WINDOW[1];
}
function kaStatus(cls, txt, flash){
  const el = document.getElementById('kaStat');
  if(el){
    el.className = 'ka-stat' + (cls ? ' ' + cls : '');
    el.textContent = txt || '';
  }
  // 手机端看不到这行小字 → 要紧的事用小气泡闪一下（2 秒自动消失）
  if(flash && txt && typeof showToast === 'function') showToast(txt);
}
function kaSetBtn(on){
  const b = document.getElementById('kaBtn');
  if(!b) return;
  b.classList.toggle('on', !!on);
  b.classList.remove('err');
  const n = document.getElementById('kaNum');
  if(n) n.textContent = on ? '…' : '保活';
}
function kaNum(mins){
  const n = document.getElementById('kaNum');
  if(n) n.textContent = String(mins);
}
function kaErr(){
  const b = document.getElementById('kaBtn');
  if(b) b.classList.add('err');
  const n = document.getElementById('kaNum');
  if(n) n.textContent = '!';
}
async function kaWakeLock(){
  try{
    if(navigator.wakeLock && document.visibilityState === 'visible'){
      _kaLock = await navigator.wakeLock.request('screen');
      _kaLock.addEventListener('release', function(){ _kaLock = null; });
      return true;
    }
  }catch(e){ /* 不支持/被拒绝：不影响心跳 */ }
  return false;
}
function kaPing(){
  return fetch('/api/ping', {cache:'no-store'}).then(r=>r.ok).catch(()=>false);
}
function kaBeat(){
  if(!kaInServiceWindow()){
    kaStatus('', '凌晨休息，心跳暂停（省额度）');
    return;
  }
  kaPing().then(ok=>{
    if(!ok){ kaErr(); kaStatus('err', '暂时连不上，自动重试中…', true); return; }
    const mins = Math.round((Date.now() - _kaStart) / 60000);
    kaNum(mins < 1 ? 0 : mins);
    kaStatus('on', '在线 · 已保活 ' + (mins < 1 ? '不到 1' : mins) + ' 分钟');
  });
  if(!_kaLock) kaWakeLock();   // 切到别的 App 再回来，常亮会失效 → 重新申请
}
function startKeepAlive(silent){
  if(_kaTimer) clearInterval(_kaTimer);
  _kaStart = Date.now();
  try{ localStorage.setItem(KA_KEY, '1'); }catch(e){}
  kaSetBtn(true);
  kaWakeLock().then(hasLock=>{
    kaStatus('on', hasLock ? '屏幕常亮中' : '请别锁屏（本浏览器不支持常亮）',
             !silent && !hasLock);
    if(!silent && hasLock && typeof showToast === 'function') showToast('✅ 保活已开：屏幕不灭、系统不睡');
  });
  kaBeat();
  _kaTimer = setInterval(kaBeat, 5 * 60 * 1000);
}
function stopKeepAlive(silent){
  if(_kaTimer){ clearInterval(_kaTimer); _kaTimer = null; }
  try{ if(_kaLock){ _kaLock.release(); _kaLock = null; } }catch(e){}
  try{ localStorage.removeItem(KA_KEY); }catch(e){}
  kaSetBtn(false);
  if(!silent){
    kaStatus('', '已关闭（备餐时建议开着）');
    if(typeof showToast === 'function') showToast('保活已关');
  }
}
function toggleKeepAlive(){ if(_kaTimer) stopKeepAlive(); else startKeepAlive(); }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && _kaTimer) kaBeat();
});

// ===== 本地缓存：系统睡着时也能先看到上次的备餐清单 =====
function prepCacheKey(d){ return 'prep_cache_' + d; }
function prepCacheSave(d, data){
  try{ localStorage.setItem(prepCacheKey(d), JSON.stringify({t: Date.now(), data: data})); }catch(e){}
}
function prepCacheGet(d){
  try{
    const s = localStorage.getItem(prepCacheKey(d));
    if(!s) return null;
    const o = JSON.parse(s);
    return (o && o.data) ? o : null;
  }catch(e){ return null; }
}
function prepStaleNote(txt){
  const el = document.getElementById('prepStale');
  if(el) el.innerHTML = txt || '';
}

function loadPrepDates(autoSwitch){
  return fetchJSONRetry('/api/prep/dates').then(res=>{
    if(!res || !res.ok){
      const box = document.getElementById('dateChips');
      if(box) box.innerHTML = '<div class="muted" style="padding:6px;font-size:14px">'+
        '⚠️ 日期加载失败（系统可能正在启动） '+
        '<button class="btn btn-sm btn-primary" onclick="loadPrepDates(false)">🔄 重试</button></div>';
      return;
    }
    prepDates = res.dates || [];
    const todayStr = res.today;
    todayDateStr = todayStr;
    renderDateChips();
    // 首次进入：始终以今天为默认日期（不自动跳到未来/过去，避免混淆）
    if(autoSwitch !== false){
      document.getElementById('datePick').value = todayStr;
      loadPrep();
    }
  });
}

function renderDateChips(){
  // ⚠️ "今天"必须用后端给的 todayDateStr（=真正的今天），不能把"当前选中的日期"当成今天。
  // 以前 loadPrep() 把选中日期传进来 → 点任何一天，那条日期就会被标成"📍 今天"。
  const todayStr = todayDateStr || localToday();
  const box = document.getElementById('dateChips');
  if(!prepDates.length){
    box.innerHTML = '<div class="muted" style="padding:6px;font-size:14px">📅 当前无待备订单</div>';
    return;
  }
  // 确保"今天"在列表里（即使今天没订单也要显示）
  const dates = [...prepDates];
  if(!dates.find(d=>d.booking_date===todayStr)){
    dates.unshift({booking_date: todayStr, cnt: 0, is_today: true, is_past: false});
  }
  const currentDate = document.getElementById('datePick').value;
  box.innerHTML = dates.map(d=>{
    const cls = [
      'date-chip',
      d.is_today ? 'today' : '',
      d.is_past ? 'past' : '',
      d.booking_date === currentDate ? 'active' : ''
    ].filter(Boolean).join(' ');
    // 显示友好格式：今天/明天/昨天 用相对词，其他显示 MM.DD + 星期
    const diffDays = dayDiff(d.booking_date, todayStr);
    let prefix = '';
    if(d.is_today || diffDays === 0) prefix = '📍 今天';
    else if(diffDays === 1) prefix = '⏰ 明天';
    else if(diffDays === -1) prefix = '↩️ 昨天';
    else if(diffDays > 1) prefix = `📅 ${mdOf(d.booking_date)}`;
    else prefix = `📤 ${mdOf(d.booking_date)}`;
    return `<button class="${cls}" onclick="pickDate('${d.booking_date}')">
      ${prefix} <span class="muted" style="font-weight:400">${weekdayOf(d.booking_date)}</span> <span class="chip-cnt">${d.cnt}单</span>
    </button>`;
  }).join('');
}

function pickDate(dateStr){
  document.getElementById('datePick').value = dateStr;
  loadPrep();
  // 更新按钮高亮（不全量重渲染 date chips 避免列表跳动）
  document.querySelectorAll('.date-chip').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${dateStr}'`));
  });
}

// ===== 单订单"整页核对清单"模式 =====
// 点订单行 → 调 /api/prep/merged?ids=<oid>（返回结构与合并视图完全一致，只是只含这一单）
// 因此可以直接复用 renderMerged / toggleItem / checkCat / checkAll 这一整套勾选逻辑。
let focusOid = null;
let savedPrepData = null;

function enterFocus(oid){
  if(!oid) return;
  savedPrepData = prepData;
  focusOid = oid;
  document.getElementById('dateChips').style.display='none';
  document.getElementById('ordersCard').style.display='none';
  document.getElementById('orderView').style.display='none';
  const tab = document.querySelector('.mode-tab');
  if(tab) tab.style.display='none';
  document.getElementById('focusBar').style.display='block';
  loadPrep();
}

function renderFocusHeader(o){
  const el = document.getElementById('focusMeta');
  const sub = document.getElementById('focusSub');
  const todayStr = todayDateStr || localToday();
  const oDate = o.booking_date || '';
  const diff = oDate ? dayDiff(oDate, todayStr) : null;
  let dLabel = '待定';
  if(oDate){
    if(diff===0) dLabel = '今天';
    else if(diff===1) dLabel = '明天';
    else if(diff===-1) dLabel = '昨天';
    else dLabel = `${mdOf(oDate)} ${weekdayOf(oDate)}`;
  }
  const t = orderTimeOf(o) || '';
  const pkgs = (o.packages||[]).map(p=>`${p.name}×${p.quantity}`).join(' · ');
  el.innerHTML = `📍 ${o.address||'—'} · ${dLabel}${t?' '+t:''}`;
  sub.innerHTML = `👤 ${o.contact_name||'—'}${o.contact_phone?' · '+o.contact_phone:''} · 🍱 ${pkgs||'套餐未记录'}` +
    (o.note && o.note!=='无' ? ` · 📝 ${o.note}` : '') +
    ` <a href="/orders?focus=${o.id}" style="color:var(--primary);font-weight:700">📋 看该订单 →</a>`;
}

function exitFocus(){
  focusOid = null;
  prepData = savedPrepData;
  document.getElementById('focusBar').style.display='none';
  document.getElementById('dateChips').style.display='';
  document.getElementById('ordersCard').style.display='';
  document.getElementById('orderView').style.display = currentMode==='order' ? '' : 'none';
  const tab = document.querySelector('.mode-tab');
  if(tab) tab.style.display='';
  render();
}

function loadPrep(){
  // 单订单核对清单模式：只取这一单的数据，并复用合并视图的渲染与勾选逻辑
  if(focusOid){
    return fetchJSONRetry('/api/prep/merged?ids='+focusOid).then(d2=>{
      if(!d2 || !d2.ok){
        const box = document.getElementById('prepList');
        if(box) box.innerHTML = '<div class="muted" style="padding:24px;text-align:center">⚠️ 加载失败（系统可能正在启动），点「🔄 刷新」重试</div>';
        return;
      }
      prepData = d2.data;
      prepData.__date = 'focus';
      const o = (prepData.orders||[]).find(x=>x.id===focusOid);
      if(o) renderFocusHeader(o);
      document.getElementById('ordersCard').style.display='none';
      document.getElementById('orderView').style.display='none';
      document.getElementById('focusBar').style.display='block';
      document.getElementById('prepCard').style.display='';
      renderMerged();
    });
  }
  const d = document.getElementById('datePick').value;
  // 先用上次缓存把画面撑起来（系统睡着时也不至于空白）
  const cached = prepCacheGet(d);
  if(cached && (!prepData || prepData.__date !== d)){
    prepData = cached.data;
    prepData.__date = d;
    render();
    renderDateChips();
    const mins = Math.max(1, Math.round((Date.now() - cached.t) / 60000));
    prepStaleNote('⏳ ' + mins + ' 分钟前的数据，正在取最新…');
  }
  return fetchJSONRetry('/api/prep/merged?date='+d).then(d2=>{
    if(!d2 || !d2.ok){
      const box = document.getElementById('ordersList');
      const haveCache = !!cached;
      prepStaleNote(haveCache
        ? '⚠️ 暂时连不上服务器（可能正在唤醒）。上面是 ' +
          Math.max(1, Math.round((Date.now() - cached.t)/60000)) + ' 分钟前的缓存数据，点「🔄 刷新」重试。'
        : '');
      if(box && !haveCache){
        box.innerHTML = '<div class="muted" style="padding:24px;text-align:center">'+
          '⚠️ 数据加载失败（网络异常）<br><br>'+
          '<button class="btn btn-primary btn-sm" onclick="loadPrep()">🔄 重新加载</button></div>';
      }
      return;
    }
    prepStaleNote('');
    prepData = d2.data;
    prepData.__date = d;
    prepCacheSave(d, d2.data);
    osClearCache();     // 数据刷新了 -> "这一单的菜"也重新取，别显示旧的
    render();
    renderDateChips();  // 重新渲染 chips 以更新 active 状态
  });
}

function urgBadge(u){
  if(!u) return '';
  const clsMap = {
    overdue:'urg-overdue', soon:'urg-soon', normal:'urg-normal',
    past:'urg-past', future:'urg-future'
  };
  const cls = clsMap[u.level] || 'urg-normal';
  return `<span class="${cls}">${u.label}</span>`;
}

function render(){
  if(!prepData) return;
  const d = prepData;
  let orders = d.orders || [];

  // 动态标题：根据选中日期显示，不再写死"今日"
  const selDate = document.getElementById('datePick').value;
  const todayStr = todayDateStr || selDate;
  const diff = dayDiff(selDate, todayStr);
  let titlePrefix = '';
  if(diff===0) titlePrefix='📍 今天';
  else if(diff===1) titlePrefix='⏰ 明天';
  else if(diff===-1) titlePrefix='↩️ 昨天';
  else if(diff>1) titlePrefix='📅';
  else titlePrefix='📤';
  const dateText = diff===0 ? '' : ` ${mdOf(selDate)}`;
  const weekdayText = ` ${weekdayOf(selDate)}`;
  document.getElementById('ordersTitle').innerHTML =
    `<span class="dot" style="background:var(--accent)"></span>${titlePrefix}${dateText}<span class="muted" style="font-weight:400;font-size:14px">${weekdayText}</span> 待备订单`;

  if(!orders.length){
    const emptyHint = diff===0 ? '🍖 今天暂无待备订单' : `🍖 ${titlePrefix}${dateText}${weekdayText} 暂无待备订单`;
    document.getElementById('ordersList').innerHTML = `<div class="muted" style="padding:24px;text-align:center;font-size:16px">${emptyHint}</div>`;
    document.getElementById('prepCard').style.display='none';
    document.getElementById('orderView').style.display='none';
    return;
  }
  // 排序：严格按出餐时间（日期 + 时间）升序；时间相同再按地点
  orders = orders.slice().sort((a,b)=>{
    const da = a.booking_date || '9999-99-99', db = b.booking_date || '9999-99-99';
    const ta = da + ' ' + (orderTimeOf(a) || '99:99');
    const tb = db + ' ' + (orderTimeOf(b) || '99:99');
    if(ta !== tb) return ta < tb ? -1 : 1;
    const aa = a.address || '', ab = b.address || '';
    if(aa !== ab) return aa < ab ? -1 : 1;
    return (a.id||0) - (b.id||0);
  });
  d.orders = orders;
  document.getElementById('ordersList').innerHTML = orders.map(o=>{
    const pkgs = (o.packages||[]).map(p=>`${p.name}×${p.quantity}`).join(' ');
    // 日期显示：今天只显示时间，非今天显示 MM.DD + 星期
    const oDate = o.booking_date || '';
    const oDiff = oDate ? dayDiff(oDate, todayStr) : null;
    let dateLabel = '';
    if(oDate){
      if(oDiff===0) dateLabel = `今天 ${o.booking_time||''}`;
      else if(oDiff===1) dateLabel = `明天 ${o.booking_time||''}`;
      else if(oDiff===-1) dateLabel = `昨天 ${o.booking_time||''}`;
      else dateLabel = `${mdOf(oDate)} ${weekdayOf(oDate)} ${o.booking_time||''}`;
    } else {
      dateLabel = o.booking_time || '待定';
    }
    // 日期列（今天/明天用中文，其余 MM.DD 周X）
    let dateText2 = '待定';
    if(oDate){
      if(oDiff===0) dateText2 = '今天';
      else if(oDiff===1) dateText2 = '明天';
      else if(oDiff===-1) dateText2 = '昨天';
      else dateText2 = `${mdOf(oDate)} ${weekdayOf(oDate)}`;
    }
    // 时间列：只显示一个（订单时间/用餐时间视为同一个）
    const t = orderTimeOf(o) || '—';
    const addr = o.address || '—';
    const nm = o.contact_name || '—';
    const nt = o.note || '';
    return `<div class="orow" onclick="enterFocus(${o.id})" title="点一下 → 打开这单的备餐核对清单（整页）">
      <span class="c-addr">📍 ${addr}</span>
      <span class="c-date">${dateText2}</span>
      <span class="c-time">${t}</span>
      <span class="c-pkg">🍱 ${pkgs||'—'}</span>
      <span class="c-name">👤 ${nm}</span>
      ${nt ? `<span class="c-note">📝 ${nt}</span>` : ''}
    </div>`;
  }).join('');
  // 说明：不再插入列对齐用的大表头——图标(📍📅⏰🍱👤📝)本身即标签，
  // 去掉表头可避免"表头固定宽度"把整页撑宽、导致手机上要左右滑动。

  if(currentMode==='merged'){
    document.getElementById('orderView').style.display='none';
    renderMerged();
  } else {
    document.getElementById('prepCard').style.display='none';
    renderByOrder();
  }
}

// 备餐行：7列（勾选|名字|份数|克数|单位|总量|状态）
// 注：packaging/utensil/tool 无"克数"列（显示—）
// 工具：份数列直接显示真实件数（如 椅子6、蛋卷桌2），不按"份"统计
// 总量列统一为"数字+单位"格式（如 600克、8个）
var TOOL_UNIT = {'椅子':'把','蛋卷桌':'张','桌子':'张','卡式炉':'套','天幕':'顶',
                 '剪刀':'把','夹子':'把','烤盘':'个','燃气罐':'个'};
function itemRow(it, type, checkedMap){
  const key = type+'_'+it.id;
  const checked = checkedMap[key];
  // 判断是否为简单分类（无克数）：包装/餐具/工具 + 可乐雪碧饮料
  const isSimple = ['packaging','utensil','tool'].includes(it._cat)
    || (it._cat==='drink' && /可乐|雪碧/.test(it.name||''));
  const isTool = type==='tool';
  let unit = it.unit||'';
  if(isTool && !unit){ unit = TOOL_UNIT[it.name] || '个'; }
  // 工具：份数列=真实件数（3人餐/10人餐能直接看出数量差异）；其余按份数
  const totPkg = isTool ? round(it.total||0) : round(it.total_portions||it.total_packages||0);
  const perSize = isSimple ? '' : round(it.portion_size||0);
  const total = round(it.total);
  const totalStr = total + unit;
  const shortTxt = it.shortage>0 ? `缺 ${round(it.shortage)}${unit}` : '✓库存足';
  const shortCls = it.shortage>0 ? '' : 'ok';
  return `<div class="prep-row ${checked?'checked':''}">
    <input type="checkbox" ${checked?'checked':''} onchange="toggleItem('${type}',${it.id},${checked?0:1})">
    <div class="pr-name">${it.name}${it.swapped_in?' <span title="按备注换菜" style="color:#c0392b;font-weight:700">🔄换</span>':''}</div>
    <div class="pr-ord">${totPkg}</div>
    <div class="pr-per">${perSize||'—'}</div>
    <div class="pr-unit">${unit}</div>
    <div class="pr-total">${totalStr}</div>
    <div class="pr-short ${shortCls}">${shortTxt}</div>
  </div>`;
}

// 表头行（每个分类块顶部）
function headerRow(){
  return `<div class="prep-header">
    <div></div>
    <div>名字</div>
    <div>份数</div>
    <div>克数</div>
    <div>单位</div>
    <div style="text-align:right">总量</div>
    <div style="text-align:right">状态</div>
  </div>`;
}

// 分类块：背景色 + 标题 + 表头 + 行
function catBlock(cat, items, type, checkedMap){
  const label = CAT_LABEL[cat] || cat;
  const cls = 'cat-'+cat;
  const typeStr = type==='tool' ? 'tool' : 'ing';
  // 给每个 item 标记所属分类，供 itemRow 判断是否需要克数列
  const taggedItems = items.map(it=>({...it, _cat:cat}));
  // 判断该分类是否全部已勾选
  const allChecked = taggedItems.every(it=>checkedMap[typeStr+'_'+it.id]);
  const btnText = allChecked ? '❎ 取消全选' : '✅ 全选';
  const btnAction = allChecked ? 'false' : 'true';
  return `<div class="cat-block ${cls}">
    <div class="cat-head">
      <span>${label} <span class="cat-count">${items.length} 项</span></span>
      <button class="check-all-btn" onclick="checkCat('${cat}','${typeStr}',${btnAction})">${btnText}</button>
    </div>
    ${headerRow()}
    ${taggedItems.map(it=>itemRow(it, type, checkedMap)).join('')}
  </div>`;
}

function renderMerged(){
  const d = prepData;
  const cm = d.checked_map || {};
  const ingCats = d.ingredients || {};
  const pk = d.packaging || [];
  const tw = d.tableware || [];
  const tools = d.tools || [];

  // 按菜单分类顺序统一渲染：牛肉→猪肉→鸡肉→素菜→小菜→小料→赠品→食材包装→客户餐具→主食→其他→工具
  let html='';
  for(const cat of CAT_ORDER){
    let items = [];
    let type = 'ing';
    if(cat==='packaging'){
      items = pk;
    } else if(cat==='utensil'){
      items = tw;
    } else if(cat==='tool'){
      items = tools; type='tool';
    } else {
      items = ingCats[cat]||[];
    }
    if(!items || !items.length) continue;
    html += catBlock(cat, items, type, cm);
  }
  const hasAny = html.length>0;
  document.getElementById('prepCard').style.display = hasAny?'':'none';
  document.getElementById('prepList').innerHTML = html;
  // 更新主"全选"按钮为切换状态
  updateMainCheckAllBtn(cm, ingCats, pk, tw, tools);
}

// 更新主"全选/取消全选"按钮文字和动作
function updateMainCheckAllBtn(cm, ingCats, pk, tw, tools){
  const btn = document.querySelector('#prepCard .check-all-btn');
  if(!btn) return;
  // 收集所有item的checked key
  const allKeys = [];
  for(const cat of Object.values(ingCats)){
    cat.forEach(it=>allKeys.push('ing_'+it.id));
  }
  pk.forEach(it=>allKeys.push('ing_'+it.id));
  tw.forEach(it=>allKeys.push('ing_'+it.id));
  tools.forEach(it=>allKeys.push('tool_'+it.id));
  if(!allKeys.length){ btn.style.display='none'; return; }
  btn.style.display='';
  const allChecked = allKeys.every(k=>cm[k]);
  btn.textContent = allChecked ? '❎ 取消全选' : '✅ 全选';
  btn.onclick = ()=>checkAll('all', !allChecked);
}

function renderByOrder(){
  const d = prepData;
  const box = document.getElementById('orderView');
  box.style.display='';
  const todayStr = todayDateStr || document.getElementById('datePick').value;
  box.innerHTML = d.orders.map(o=>{
    // 日期显示：今天只显示时间，非今天显示 MM.DD + 星期
    const oDate = o.booking_date || '';
    const oDiff = oDate ? dayDiff(oDate, todayStr) : null;
    // 只显示一个时间（订单时间/用餐时间视为同一个）
    const t = orderTimeOf(o);
    let dateLabel = '';
    if(oDate){
      if(oDiff===0) dateLabel = `今天 ${t}`;
      else if(oDiff===1) dateLabel = `明天 ${t}`;
      else if(oDiff===-1) dateLabel = `昨天 ${t}`;
      else dateLabel = `${mdOf(oDate)} ${weekdayOf(oDate)} ${t}`;
    } else {
      dateLabel = t || '待定';
    }
    const pkgsTxt = (o.packages||[]).map(p=>`${p.name}×${p.quantity}`).join(' ');
    return `<div class="card" id="ord-${o.id}"><div class="sec-toolbar">
      <h3 style="margin:0">📍 ${o.address||'—'} · 📅 ${dateLabel} · 🍱 ${pkgsTxt||'—'} · 👤 ${o.contact_name||'—'}</h3>
      <span>
        <button class="check-all-btn" onclick="window.open('/orders/${o.id}/ticket','_blank')" style="font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:#27ae60;color:#fff;cursor:pointer;font-weight:700">🖨 出餐单</button>
        <button class="check-all-btn" onclick="checkAllOrder(${o.id},true)" style="font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700">✅ 全选</button>
      </span>
    </div><div class="muted" style="padding:16px">加载中...</div></div>`;
  }).join('');
  d.orders.forEach(o=>{
    fetch('/api/orders/'+o.id+'/requirements').then(r=>r.json()).then(res=>{
      if(!res.ok) return;
      const r = res.data;
      const container = document.querySelector('#ord-'+o.id+' .muted');
      if(!container) return;
      let html = '';
      // 按分类分组
      const byCat = {};
      for(const it of r.ingredients){
        const c = subcatFor(it.name, it.category||'other');
        byCat[c] = byCat[c] || [];
        byCat[c].push(it);
      }
      // 工具归入 byCat['tool']，由 CAT_ORDER 统一排序
      if(r.tools.length){
        byCat['tool'] = r.tools.map(it=>({
          id:it.id, name:it.name, unit:'', per_package:it.per_package,
          total_packages:it.order_qty, order_count:1, total:it.need,
          shortage:it.shortage, order_ids:[o.id], isTool:true
        }));
      }
      for(const cat of CAT_ORDER){
        if(!byCat[cat]) continue;
        // 固定顺序排序，不在列表的按用量降序
        byCat[cat].sort((a,b)=>{
          const ia = getFixedIdx(a.name, cat);
          const ib = getFixedIdx(b.name, cat);
          if(ia!==ib) return ia-ib;
          return (b.need||0)-(a.need||0);
        });
        const type = (cat==='tool') ? 'tool' : 'ing';
        html += catBlock(cat, byCat[cat].map(it=>({
          id:it.id, name:it.name, unit:it.unit||'', per_package:it.per_package,
          portion_size:it.portion_size, total_portions:it.total_portions,
          total_packages:it.total_packages||it.order_qty, order_count:1, total:it.total||it.need,
          shortage:it.shortage, order_ids:it.order_ids||[o.id]
        })), type, {});
      }
      container.outerHTML = html || '<div class="muted" style="padding:16px">无需求</div>';
    });
  });
}

// ===== 点订单行 → 看"这一单具体要备什么菜" =====
// 合并视图把多单的食材汇总在一起了；后厨想知道"这一单到底要备哪些菜"时点一下就出来。
// 数据用"按订单视图"同一个接口 /api/orders/<id>/requirements。
const _osReqCache = {};
let _osOid = null;
function openOrderSheet(oid){
  const o = ((prepData && prepData.orders) || []).find(x=>x.id===oid);
  if(!o) return;
  _osOid = oid;
  const todayStr = todayDateStr || localToday();
  const oDate = o.booking_date || '';
  const oDiff = oDate ? dayDiff(oDate, todayStr) : null;
  let dLabel = '待定';
  if(oDate){
    if(oDiff===0) dLabel = '今天';
    else if(oDiff===1) dLabel = '明天';
    else if(oDiff===-1) dLabel = '昨天';
    else dLabel = `${mdOf(oDate)} ${weekdayOf(oDate)}`;
  }
  const t = orderTimeOf(o);
  document.getElementById('osTitle').textContent = `📍 ${o.address||'—'} · ${dLabel}${t?' '+t:''}`;
  const pkgs = (o.packages||[]).map(p=>`${p.name}×${p.quantity}`).join(' · ');
  document.getElementById('osBody').innerHTML =
    `<div class="os-sum">👤 ${o.contact_name||'—'}${o.contact_phone?' · '+o.contact_phone:''}</div>` +
    `<div class="os-pack">🍱 ${pkgs||'套餐未记录'}</div>` +
    ((o.note && o.note!=='无') ? `<div class="os-note">📝 ${o.note}</div>` : '') +
    `<div id="osList">${_osReqCache[oid] ? '' : '<div class="os-sum">明细加载中…</div>'}</div>`;

  document.getElementById('osSheet').classList.add('on');

  fetch('/api/orders/'+oid+'/requirements').then(r=>r.json()).then(res=>{

    _osReqCache[oid] = res.data || {};
    if(_osOid === oid) osRenderList(oid);
  }).catch(()=>{ osErr('⚠️ 明细加载失败（网络异常）'); });
}
function osClearCache(){ for(const k in _osReqCache) delete _osReqCache[k]; }
function osErr(msg){
  const el = document.getElementById('osList');
  if(el) el.innerHTML = `<div class="os-sum">${msg}</div>`;
}
// 用量按用户要的口径显示：**份**（一份=固定克数，点数最直观）+ **公斤/斤/袋**（他买货的口径）。
// 不再只给克数（用户原话：按克算不方便，份是固定的克数、公斤是我购买的价格）。
function osQty(it){
  const u = it.unit || '';
  const need = it.need || 0;
  const isWeight = (u === 'g' || u === 'ml');
  if(!isWeight){
    return round(need) + (u || '');        // 个/套/包/瓶…保持原单位
  }
  const pu = it.purchase_unit || '';       // 公斤 / 斤 / 袋 …
  const pf = it.purchase_factor || 0;      // 1 个采购单位 = 多少克
  let main;
  if(it.total_portions){
    main = round(it.total_portions) + '份';
  } else if(pf > 0){
    main = round(need / pf) + (pu || '公斤');
  } else {
    main = round(need / 1000) + '公斤';
  }
  let sub = '';
  if(pf > 0){
    const v = need / pf;
    sub = '≈' + (v >= 10 ? Math.round(v) : Math.round(v * 100) / 100) + (pu || '');
  }
  return main + (sub ? `<span class="qt2">${sub}</span>` : '');
}
function osRenderList(oid){
  const el = document.getElementById('osList');
  const r = _osReqCache[oid];
  if(!el || !r) return;
  const byCat = {};
  for(const it of (r.ingredients||[])){
    const c = subcatFor(it.name, it.category||'other');
    (byCat[c] = byCat[c] || []).push(it);
  }
  if((r.tools||[]).length){
    byCat['tool'] = r.tools.map(it=>({name:it.name, unit:TOOL_UNIT[it.name]||'个',
      need:it.need, shortage:it.shortage}));
  }
  let html = '';
  for(const cat of CAT_ORDER){
    const items = byCat[cat];
    if(!items || !items.length) continue;
    items.sort((a,b)=>{
      const ia = getFixedIdx(a.name, cat), ib = getFixedIdx(b.name, cat);
      if(ia !== ib) return ia - ib;
      return (b.need||0) - (a.need||0);
    });
    html += `<div class="os-cat">${CAT_LABEL[cat]||cat}</div>` + items.map(it=>{
      const short = it.shortage>0 ? ` <span class="short">缺${round(it.shortage)}</span>` : '';
      const sw = it.swapped_in ? ' <span style="color:#c0392b;font-weight:700">🔄换</span>' : '';
      return `<div class="os-row"><span class="nm">${it.name}${sw}</span>` +
             `<span class="qt">${osQty(it)}${short}</span></div>`;
    }).join('');
  }
  el.innerHTML = html || '<div class="os-sum">这一单没有食材明细</div>';
}
function closeOrderSheet(){
  document.getElementById('osMask').classList.remove('on');
  document.getElementById('osSheet').classList.remove('on');
  _osOid = null;
}
function osOpenTicket(){ if(_osOid) window.open('/orders/'+_osOid+'/ticket','_blank'); }
function osOpenOrderPage(){ if(_osOid) window.open('/orders/'+_osOid,'_blank'); }
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeOrderSheet();
});

// 简单子分类（按订单视图用，按名字细分）
function subcatFor(name, cat){
  const n = name || '';
  // 馒头归素菜（用户指定）
  if(n.includes('馒头')) return 'vegetable';
  if(cat !== 'meat') {
    // side(小菜)/sauce(小料)/drink(赠品)/staple(主食) 各自独立，不再合并
    return cat;
  }
  // 小肠优先归牛肉（爆汁烤小肠 = 牛肠）
  if(n.includes('小肠')) return 'beef';
  if(n.includes('牛')) return 'beef';
  if(n.includes('鸡') || n.includes('掌中宝') || n.includes('脚筋') || n.includes('郡肝')) return 'chicken';
  if(n.includes('猪') || n.includes('五花肉') || n.includes('松板肉') || n.includes('梅花肉') || n.includes('肠')) return 'pork';
  return 'other';
}

function toggleItem(type, iid, checked){
  const d = prepData;
  let order_ids = [];
  if(type==='ing'){
    for(const cat of Object.values(d.ingredients||{})){
      const it = cat.find(x=>x.id===iid);
      if(it){ order_ids = it.order_ids; break; }
    }
    if(!order_ids.length){
      const it = (d.packaging||[]).find(x=>x.id===iid);
      if(it) order_ids = it.order_ids;
    }
    if(!order_ids.length){
      const it = (d.tableware||[]).find(x=>x.id===iid);
      if(it) order_ids = it.order_ids;
    }
  } else {
    const it = (d.tools||[]).find(x=>x.id===iid);
    if(it) order_ids = it.order_ids;
  }
  fetch('/api/prep/check',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({order_ids, item_type:type==='ing'?'ingredient':'tool', item_id:iid, checked:checked})})
    .then(r=>r.json()).then(()=>loadPrep());
}

function checkCat(cat, type, checked){
  const d = prepData;
  let items = [];
  if(type==='ing'){
    if(cat==='utensil'){
      items = (d.tableware||[]).map(it=>({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    } else if(cat==='packaging'){
      items = (d.packaging||[]).map(it=>({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    } else {
      items = (d.ingredients[cat]||[]).map(it=>({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    }
  } else {
    items = (d.tools||[]).map(it=>({type:'tool', id:it.id, order_ids:it.order_ids}));
  }
  Promise.all(items.map(it=>fetch('/api/prep/check',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({order_ids:it.order_ids, item_type:it.type, item_id:it.id, checked:checked})})))
    .then(()=>loadPrep());
}

function checkAll(section, checked){
  const d = prepData;
  let ids = [];
  if(section==='all'){
    // 全选：所有食材分类 + 食材包装 + 客户餐具 + 工具
    for(const cat of Object.values(d.ingredients||{})){
      cat.forEach(it=>ids.push({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    }
    (d.packaging||[]).forEach(it=>ids.push({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    (d.tableware||[]).forEach(it=>ids.push({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    (d.tools||[]).forEach(it=>ids.push({type:'tool', id:it.id, order_ids:it.order_ids}));
  } else if(section==='ing'){
    for(const cat of Object.values(d.ingredients||{})){
      cat.forEach(it=>ids.push({type:'ingredient', id:it.id, order_ids:it.order_ids}));
    }
  } else if(section==='pk'){
    (d.packaging||[]).forEach(it=>ids.push({type:'ingredient', id:it.id, order_ids:it.order_ids}));
  } else if(section==='tw'){
    (d.tableware||[]).forEach(it=>ids.push({type:'ingredient', id:it.id, order_ids:it.order_ids}));
  } else {
    (d.tools||[]).forEach(it=>ids.push({type:'tool', id:it.id, order_ids:it.order_ids}));
  }
  Promise.all(ids.map(it=>fetch('/api/prep/check',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({order_ids:it.order_ids, item_type:it.type, item_id:it.id, checked:checked})})))
    .then(()=>loadPrep());
}

function checkAllOrder(oid, checked){
  fetch('/api/prep/check/batch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({order_ids:[oid], checked:checked})}).then(()=>loadPrep());
}

function round(v){ return (Math.round(v*100)/100).toString().replace(/\.00$/,''); }

// 先用本地缓存把画面撑起来：万一系统正在冷启动（日期接口也要等 30-60 秒），
// 后厨也能立刻看到上次的备餐清单，不至于对着空白页干等。
function showCachedFirst(){
  try{
    const d = document.getElementById('datePick').value || localToday();
    const c = prepCacheGet(d);
    if(!c) return;
    prepData = c.data;
    prepData.__date = d;
    render();
    const mins = Math.max(1, Math.round((Date.now() - c.t) / 60000));
    prepStaleNote('⏳ 正在唤醒，先显示 ' + mins + ' 分钟前的数据');
  }catch(e){ /* 缓存坏了不影响正常流程 */ }
}

// ===== 套餐分类：当天/本周/本月/全部 各有多少个几人餐 =====
let pkgScope = 'day';
let pkgFilter = null;
let pkgStats = null;

function loadPkgStats(){
  fetch('/api/stats/packages?scope=' + pkgScope + '&detail=1')
    .then(r=>r.json()).then(d=>{
      if(!d || !d.ok) return;
      pkgStats = d;
      // 兜底：当天没订单就自动往上看本周→本月→全部，别一进来是空的
      if(!(d.items||[]).length && pkgScope !== 'all'){
        const next = {day:'week', week:'month', month:'all'}[pkgScope];
        if(next){ setPkgScope(next); return; }
      }
      const box = document.getElementById('pkgChips');
      const sum = document.getElementById('pkgSummary');
      const items = d.items || [];
      if(!items.length){
        box.innerHTML = `<span class="muted" style="font-size:13px">${d.label||''}没有套餐订单</span>`;
        sum.textContent = '';
        document.getElementById('pkgDetail').innerHTML = '';
        return;
      }
      box.innerHTML = items.map(it=>`
        <button class="pkg-chip ${pkgFilter===it.name?'active':''}" onclick="pickPkg('${String(it.name).replace(/'/g,"\\'")}')">
          ${it.name} <span class="n">${it.order_cnt}单</span>·${it.qty}份
        </button>`).join('');
      sum.textContent = `${d.label||''} · 共 ${d.total_orders} 单 · 套餐 ${d.qty_total} 份 · 涉及约 ${d.people_total} 人`
        + (pkgFilter ? ' · 再点一下取消' : ' · 点套餐看是哪几单');
      renderPkgDetail();
    }).catch(()=>{});
}
function setPkgScope(s){
  pkgScope = s;
  document.querySelectorAll('.pkg-scope[data-pscope]').forEach(b=>b.classList.toggle('active', b.dataset.pscope===s));
  loadPkgStats();
}
function pickPkg(name){
  pkgFilter = (pkgFilter===name) ? null : name;
  loadPkgStats();
}
// 点亮的套餐：列出这个范围内是哪几单（日期/时间/地址/联系人/份数）
function renderPkgDetail(){
  const box = document.getElementById('pkgDetail');
  if(!box) return;
  if(!pkgFilter || !pkgStats){
    if(box) box.innerHTML = '';
    return;
  }
  const it = (pkgStats.items||[]).find(x=>x.name===pkgFilter);
  const list = (it && it.orders) || [];
  box.innerHTML = `<div style="font-weight:700;font-size:13px;margin-bottom:4px">🍱 ${pkgFilter}（${pkgStats.label||''}）共 ${list.length} 单</div>` +
    (list.length ? list.map(o=>`<div class="pd-row">
        <b>#${o.id}</b>
        <span>${o.booking_date||''} ${o.booking_time||''}</span>
        <span>📍${o.address||'—'}</span>
        <span>👤${o.contact_name||'—'}</span>
        <span class="muted">${o.people||''}人 × ${o.quantity||1}份</span>
      </div>`).join('') : '<div class="muted" style="font-size:13px">这个范围内没有该套餐的订单</div>');
}

showCachedFirst();
loadPkgStats();
loadPrepDates(true).then(()=>{
  // 深度联动：从订单页点"🍱 备餐核对"跳过来时，直接打开这单的整页核对清单
  const fp = new URLSearchParams(location.search).get('focus');
  if(fp){
    const foid = parseInt(fp, 10);
    if(!isNaN(foid)) enterFocus(foid);
  }
});   // 首次加载，自动切到有订单的日期
setInterval(()=>{ loadPrepDates(false); if(currentMode==='merged' && !focusOid) loadPrep(); loadPkgStats(); }, 60000);

// 上次开着"备餐保活"就自动恢复（后厨那台手机会一直开着这个页面）
try{ if(localStorage.getItem(KA_KEY) === '1') startKeepAlive(true); }catch(e){}

// ===== 刷新特效 =====
function refreshWithFx(fn){
  const btn = event.target.closest('.btn-refresh');
  if(btn){ btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'), 800); }
  if(typeof fn === 'function') fn();
  showRefreshToast();
}
function showToast(txt){
  let t = document.getElementById('refreshToast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id = 'refreshToast';
  t.className = 'refresh-toast';
  t.textContent = txt;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function showRefreshToast(){ showToast('✓ 已刷新'); }
async function doBackup(){const b=event.target;b.textContent='⏳ 备份中...';b.disabled=true;try{const r=await fetch('/api/backup',{method:'POST'});const d=await r.json();if(d.ok){b.textContent='✅ 已备份';setTimeout(()=>{b.textContent='💾 备份';b.disabled=false},2000)}else{alert(d.msg||'备份失败');b.textContent='💾 备份';b.disabled=false}}catch(e){alert('备份失败：网络错误');b.textContent='💾 备份';b.disabled=false}}
</script>
