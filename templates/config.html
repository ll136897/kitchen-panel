<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>配置 · 刘和牛户外烤肉</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.cost-cell{width:90px;text-align:right}
.cost-input{width:80px;text-align:right;border:1px solid #ddd;border-radius:4px;padding:2px 4px;font-size:13px}
.cost-input:focus{border-color:var(--primary);outline:none}
.cost-saved{color:#27ae60;font-size:11px;margin-left:4px}
.row-cost-total{background:#faf6ef;font-weight:700;color:#c0392b}
.inbound-row{background:#f0f7ff !important}
.inbound-input{width:60px;border:1px solid #bbb;border-radius:4px;padding:2px 4px;font-size:13px}
/* 低库存告警样式 */
.low-stock{background:#fdecea !important}
.low-stock td{color:#c0392b}
.low-stock .alert-badge{display:inline-block;background:#c0392b;color:#fff;font-size:10px;padding:0 5px;border-radius:8px;margin-left:4px;font-weight:600}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-item">📊 面板</a>
  <a href="/orders" class="nav-item">📋 订单</a>
  <a href="/prep" class="nav-item">🍱 备餐</a>
  <a href="/finance" class="nav-item">📈 财务</a>
  <a href="/menu" class="nav-item">📜 菜单</a>
  <a href="/config" class="nav-item active">⚙️ 配置</a>
</nav>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px">
    <div><div class="title">⚙️ 配置中心</div>
    <div class="sub">库存成本 · 定价 · 全局设置</div></div>
    <button class="btn btn-primary btn-sm btn-refresh" onclick="refreshWithFx(()=>{loadIngs();loadTools();loadPkgs();loadSettings();})">🔄 刷新</button>
  </div>

  <div class="card">
    <h3>💰 65%毛利定价计算</h3>
    <div class="inline-form">
      <input id="cost" type="number" placeholder="食材成本" step="0.01">
      <button class="btn btn-primary" onclick="calcPrice()">算售价</button>
    </div>
    <div id="priceResult" class="price-result"></div>
  </div>

  <div class="card">
    <h3>🚚 全局设置</h3>
    <div class="inline-form">
      <label>配送费 ¥</label>
      <input id="deliveryFee" type="number" step="1" style="width:90px">
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
      <span class="muted" id="deliveryHint"></span>
    </div>
    <div class="inline-form" style="margin-top:8px">
      <label>⏰ 备餐提前(小时)</label>
      <input id="prepLead" type="number" step="0.5" style="width:90px" placeholder="2">
      <button class="btn btn-primary" onclick="savePrepLead()">保存</button>
      <span class="muted">用餐时间 - 该值 = 应开始备餐时间</span>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">🥩 食材库存与成本</h3>
      <span class="muted" id="ingCostTotal"></span>
    </div>
    <table class="tbl" id="ingTable">
      <thead><tr>
        <th>食材</th><th>分类</th><th>单位</th><th>库存</th><th>阈值</th>
        <th class="cost-cell">成本¥/单位 · <span style="font-size:11px;color:#888;font-weight:400">参考</span></th><th>小计¥</th><th>调整</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="btn-row">
      <button class="btn btn-sm btn-accent" onclick="toggleInbound()">📥 采购入库</button>
      <button class="btn btn-sm" onclick="toggleAdd('ing')">+ 添加食材</button>
    </div>
    <!-- 采购入库面板 -->
    <div id="inboundPanel" style="display:none;margin-top:10px;padding:10px;background:#f0f7ff;border-radius:8px">
      <div style="font-weight:700;margin-bottom:6px">📥 批量采购入库
        <span style="font-weight:400;font-size:12px;color:#888;margin-left:8px">成本规则：涨价用新价·跌价/持平用加权平均</span>
      </div>
      <table class="tbl" id="inboundTable">
        <thead><tr><th>食材</th><th>当前库存</th><th>采购数量</th><th>采购单价¥</th><th>供应商</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="btn-row" style="margin-top:8px">
        <input id="inboundReason" placeholder="备注（可选）" style="flex:1">
        <button class="btn btn-success" onclick="submitInbound()">✅ 确认入库</button>
      </div>
      <div id="inboundMsg" style="margin-top:6px"></div>
    </div>
    <div id="addIng" style="display:none" class="inline-form">
      <input id="ingName" placeholder="名称">
      <select id="ingCat" style="min-width:90px">
        <option value="beef">🥩 牛肉</option>
        <option value="pork">🥓 猪肉</option>
        <option value="chicken">🍗 鸡肉</option>
        <option value="vegetable">🥬 素菜</option>
        <option value="side">🥗 小菜</option>
        <option value="sauce">🧂 小料</option>
        <option value="drink">🎁 赠品</option>
        <option value="packaging">📦 食材包装</option>
        <option value="utensil">🍱 客户餐具</option>
        <option value="staple">🍚 主食</option>
        <option value="other">📦 其他</option>
      </select>
      <input id="ingUnit" placeholder="单位" size="6">
      <input id="ingStock" type="number" placeholder="库存" size="6">
      <input id="ingThr" type="number" placeholder="阈值" size="6">
      <input id="ingCost" type="number" placeholder="成本" size="6" step="0.01">
      <button class="btn btn-sm btn-success" onclick="addIng()">添加</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">🔧 工具库存与成本</h3>
      <span class="muted" id="toolCostTotal"></span>
    </div>
    <table class="tbl" id="toolTable">
      <thead><tr>
        <th>工具</th><th>库存</th><th>阈值</th>
        <th class="cost-cell">成本¥/个</th><th>小计¥</th><th>调整</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="btn-row"><button class="btn btn-sm" onclick="toggleAdd('tool')">+ 添加工具</button></div>
    <div id="addTool" style="display:none" class="inline-form">
      <input id="toolName" placeholder="名称">
      <input id="toolStock" type="number" placeholder="库存" size="6">
      <input id="toolThr" type="number" placeholder="阈值" size="6">
      <input id="toolCost" type="number" placeholder="成本" size="6" step="0.01">
      <button class="btn btn-sm btn-success" onclick="addTool()">添加</button>
    </div>
  </div>

  <div class="card">
    <h3>📦 采购记录</h3>
    <button class="btn btn-sm" onclick="loadPurchases()">🔄 刷新记录</button>
    <table class="tbl" id="purchaseTable" style="margin-top:8px">
      <thead><tr><th>日期</th><th>品项</th><th>数量</th><th>单价</th><th>总额</th><th>供应商</th></tr></thead>
      <tbody><tr><td colspan="6" class="muted" style="text-align:center">点击刷新查看</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h3>🍱 套餐配置</h3>
    <div id="pkgList"></div>
  </div>
</div>
<script src="/static/app.js"></script>
<script>
function calcPrice(){
  const cost = parseFloat(document.getElementById('cost').value||0);
  fetch('/api/price',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cost:cost,margin:0.65})})
    .then(r=>r.json()).then(d=>{
      if(d.ok) document.getElementById('priceResult').innerHTML = `成本 ¥${d.cost} → 售价 <b class="price-big">¥${d.price}</b> <span class="muted">(精确 ${d.raw_price})</span>`;
    });
}

// 食材分类顺序与菜单页一致
const ING_CAT_ORDER = ['beef','pork','chicken','vegetable','side','sauce','drink','packaging','utensil','staple','other'];
const ING_CAT_LABEL = {
  beef:'🥩 牛肉', pork:'🥓 猪肉', chicken:'🍗 鸡肉',
  vegetable:'🥬 素菜', side:'🥗 小菜', sauce:'🧂 小料', drink:'🎁 赠品',
  packaging:'📦 食材包装', utensil:'🍱 客户餐具',
  staple:'🍚 主食', other:'📦 其他'
};
const ING_CAT_COLOR = {
  beef:'#8e1e1a', pork:'#c75d3e', chicken:'#c9962b',
  vegetable:'#3a8a3a', side:'#5a8a3a', sauce:'#7a5a3a',
  drink:'#666', packaging:'#d35400', utensil:'#8e44ad',
  staple:'#888', other:'#6b4f3a'
};

function loadIngs(){
  fetch('/api/ingredients').then(r=>r.json()).then(d=>{
    const data = d.data||[];
    // 按分类分组（后端已做 meat 细分 + 固定排序，组内顺序即正确顺序）
    const byCat = {};
    data.forEach(x=>{
      const c = x.category || 'other';
      (byCat[c] = byCat[c]||[]).push(x);
    });
    let totalCost = 0;
    let html = '';
    for(const cat of ING_CAT_ORDER){
      const items = byCat[cat];
      if(!items || !items.length) continue;
      const color = ING_CAT_COLOR[cat] || '#6b4f3a';
      const label = ING_CAT_LABEL[cat] || cat;
      // 分类标题行
      html += `<tr><td colspan="8" style="background:${color};color:#fff;font-weight:700;padding:6px 8px;font-size:13px">${label} · ${items.length}项</td></tr>`;
      for(const x of items){
        const sub = (x.stock||0)*(x.cost||0);
        totalCost += sub;
        const catOptions = ING_CAT_ORDER.map(c=>`<option value="${c}" ${c===cat?'selected':''}>${ING_CAT_LABEL[c]}</option>`).join('');
        // 低库存告警：stock <= threshold
        const isLow = (x.stock||0) <= (x.threshold||0);
        const lowClass = isLow ? 'low-stock' : '';
        const alertBadge = isLow ? '<span class="alert-badge">低库存</span>' : '';
        html += `<tr class="${lowClass}">
          <td><input type="text" value="${x.name}" onchange="editIng(${x.id},'name',this.value)" style="border:none;background:transparent;font-weight:700;min-width:80px">${alertBadge}</td>
          <td><select onchange="editIng(${x.id},'category',this.value)" style="border:1px solid #ddd;border-radius:4px;padding:2px;font-size:12px;background:#f9f9f9">${catOptions}</select></td>
          <td><input type="text" value="${x.unit||''}" onchange="editIng(${x.id},'unit',this.value)" size="4" style="border:none;background:transparent;text-align:center"></td>
          <td style="text-align:right;font-weight:700">${x.stock}</td><td style="text-align:right">${x.threshold}</td>
          <td class="cost-cell">
            <input type="number" class="cost-input" value="${x.cost||0}" step="0.01"
              onchange="updateCost('ingredient',${x.id},this.value)" id="cost-ing-${x.id}"
              oninput="showCostRef('ing',${x.id},this.value,'${x.unit||''}')">
            <span class="cost-ref" id="cost-ref-ing-${x.id}" style="font-size:10px;color:#888;margin-left:2px;white-space:nowrap"></span>
          </td>
          <td style="text-align:right;font-weight:700;color:#c0392b">¥${sub.toFixed(2)}</td>
          <td><input type="number" id="adj-ing-${x.id}" size="4" placeholder="±" class="inbound-input">
          <button class="btn btn-sm" onclick="adjustStock('ingredient',${x.id})">补/损</button></td>
        </tr>`;
      }
    }
    document.querySelector('#ingTable tbody').innerHTML=html || '<tr><td colspan="8" class="muted" style="text-align:center;padding:16px">暂无食材，点击"+ 添加食材"</td></tr>';
    document.getElementById('ingCostTotal').textContent = `库存价值合计: ¥${totalCost.toFixed(2)}`;
    // 初始化所有参考价
    document.querySelectorAll('[id^="cost-ing-"]').forEach(el=>{
      const id=el.id.replace('cost-ing-','');
      const refId='cost-ref-ing-'+id;
      const unit=el.closest('tr').querySelectorAll('td input')[2]?.value||'';
      showCostRef('ing',id,el.value,unit);
    });
  });
}

// 根据单位实时换算参考价（g→kg, ml→L 等）
function showCostRef(prefix,id,costVal,unit){
  const refEl=document.getElementById('cost-ref-'+prefix+'-'+id);
  if(!refEl) return;
  const c=parseFloat(costVal||0);
  if(!c||!unit){ refEl.textContent=''; return; }
  let ref='';
  if(unit==='g'){
    // 克 → kg（进货常用）
    const kg=c*1000;
    ref=`¥${kg.toFixed(kg>=100?0:1)}/kg`;
    // 额外：1kg/袋参考
    // ref += ` · ¥${kg.toFixed(0)}/袋(1kg)`;
  } else if(unit==='ml'){
    const L=c*1000;
    ref=`¥${L.toFixed(L>=10?1:2)}/L`;
  } else if(unit==='份'){
    // 份 → 盒（假设一盒=2-3份，标注参考）
    ref=`¥${(c*2).toFixed(2)}/盒(≈2份)`;
  } else if(unit==='个'){
    ref=`¥${(c*60).toFixed(0)}/袋(≈60个)`;
  } else if(unit==='瓶'){
    ref='';
  } else if(unit==='包'){
    ref='';
  }
  refEl.textContent=ref;
}

// 内联编辑食材字段（name/unit/category）
function editIng(id, field, value){
  fetch(`/api/ingredients/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({[field]:value})}).then(r=>r.json()).then(d=>{
    if(d.ok){
      showRefreshToast();
      // 仅在分类变化时重新加载（重排），其他字段不重排避免输入框失焦
      if(field==='category') loadIngs();
    }
  });
}

function loadTools(){
  fetch('/api/tools').then(r=>r.json()).then(d=>{
    const data = d.data||[];
    let totalCost = 0;
    const html=data.map(x=>{
      const sub = (x.stock||0)*(x.cost||0);
      totalCost += sub;
      // 低库存告警：stock <= threshold
      const isLow = (x.stock||0) <= (x.threshold||0);
      const lowClass = isLow ? 'low-stock' : '';
      const alertBadge = isLow ? '<span class="alert-badge">低库存</span>' : '';
      return `<tr class="${lowClass}">
        <td>${x.name}${alertBadge}</td>
        <td style="text-align:right">${x.stock}</td><td style="text-align:right">${x.threshold}</td>
        <td class="cost-cell">
          <input type="number" class="cost-input" value="${x.cost||0}" step="0.01"
            onchange="updateCost('tool',${x.id},this.value)" id="cost-tool-${x.id}">
        </td>
        <td style="text-align:right;font-weight:700;color:#c0392b">¥${sub.toFixed(2)}</td>
        <td><input type="number" id="adj-tool-${x.id}" size="4" placeholder="±" class="inbound-input">
        <button class="btn btn-sm" onclick="adjustStock('tool',${x.id})">补/损</button></td>
      </tr>`;
    }).join('');
    document.querySelector('#toolTable tbody').innerHTML=html;
    document.getElementById('toolCostTotal').textContent = `工具价值合计: ¥${totalCost.toFixed(2)}`;
  });
}

function updateCost(type,id,val){
  fetch(`/api/ingredients/${id}/cost`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cost:parseFloat(val||0),item_type:type})})
    .then(r=>r.json()).then(()=>{
      showRefreshToast();
      if(type=='ingredient'){loadIngs();}else{loadTools();}
    });
}

// ===== 采购入库 =====
function toggleInbound(){
  const p = document.getElementById('inboundPanel');
  if(p.style.display=='none'){
    p.style.display='block';
    loadInboundTable();
  } else {
    p.style.display='none';
  }
}

function loadInboundTable(){
  fetch('/api/ingredients').then(r=>r.json()).then(d=>{
    const data = d.data||[];
    // 按分类分组，与菜单页顺序一致
    const byCat = {};
    data.forEach(x=>{
      const c = x.category || 'other';
      (byCat[c] = byCat[c]||[]).push(x);
    });
    let html = '';
    for(const cat of ING_CAT_ORDER){
      const items = byCat[cat];
      if(!items || !items.length) continue;
      const color = ING_CAT_COLOR[cat] || '#6b4f3a';
      const label = ING_CAT_LABEL[cat] || cat;
      html += `<tr><td colspan="5" style="background:${color};color:#fff;font-weight:700;padding:4px 8px;font-size:12px">${label} · ${items.length}项</td></tr>`;
      for(const x of items){
        const isLow = (x.stock||0) <= (x.threshold||0);
        const rowClass = isLow ? 'inbound-row low-stock' : 'inbound-row';
        html += `<tr class="${rowClass}">
          <td>${x.name}<span class="muted">(${x.unit})</span></td>
          <td style="text-align:right">${x.stock}</td>
          <td><input type="number" class="inbound-input" id="ib-qty-${x.id}" placeholder="0" step="0.1"></td>
          <td><input type="number" class="inbound-input" id="ib-price-${x.id}" placeholder="¥" step="0.01" value="${x.cost||''}"></td>
          <td><input type="text" class="inbound-input" id="ib-sup-${x.id}" placeholder="供应商" style="width:100px"></td>
        </tr>`;
      }
    }
    document.querySelector('#inboundTable tbody').innerHTML=html || '<tr><td colspan="5" class="muted" style="text-align:center;padding:12px">暂无食材</td></tr>';
  });
}

function submitInbound(){
  fetch('/api/ingredients').then(r=>r.json()).then(d=>{
    const items=[];
    (d.data||[]).forEach(x=>{
      const qty=parseFloat(document.getElementById(`ib-qty-${x.id}`).value||0);
      const price=parseFloat(document.getElementById(`ib-price-${x.id}`).value||0);
      const sup=document.getElementById(`ib-sup-${x.id}`).value||'';
      if(qty>0) items.push({item_type:'ingredient',item_id:x.id,qty:qty,unit_price:price,supplier:sup});
    });
    if(!items.length){document.getElementById('inboundMsg').innerHTML='<span style="color:#e74c3c">未填写任何采购数量</span>';return;}
    const reason=document.getElementById('inboundReason').value||'采购入库';
    fetch('/api/stock/inbound',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:items,reason:reason})})
      .then(r=>r.json()).then(d=>{
        if(d.ok){
          document.getElementById('inboundMsg').innerHTML=`<span style="color:#27ae60">✅ 成功入库 ${d.done} 项</span>`;
          showRefreshToast();
          loadIngs();
          loadInboundTable();
          setTimeout(()=>{document.getElementById('inboundMsg').innerHTML='';},3000);
        }
      });
  });
}

function loadPurchases(){
  fetch('/api/purchases').then(r=>r.json()).then(d=>{
    const html=(d.data||[]).map(p=>`<tr>
      <td>${(p.purchased_at||'').slice(0,16)}</td>
      <td>${p.item_name||'-'}</td>
      <td style="text-align:right">${p.quantity} ${p.item_unit||''}</td>
      <td style="text-align:right">¥${p.unit_price}</td>
      <td style="text-align:right;font-weight:700;color:#c0392b">¥${p.total_cost}</td>
      <td>${p.supplier||'-'}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="muted" style="text-align:center">暂无记录</td></tr>';
    document.querySelector('#purchaseTable tbody').innerHTML=html;
  });
}

function loadPkgs(){
  fetch('/api/packages').then(r=>r.json()).then(d=>{
    const html=(d.data||[]).map(p=>{
      const ings=(p.ingredients||[]).map(i=>`${i.ing_name}×${i.per_package}`).join(', ')||'<span class="muted">无</span>';
      const tools=(p.tools||[]).map(t=>`${t.tool_name}×${t.per_package}`).join(', ')||'<span class="muted">无</span>';
      const base = p.base_price != null ? p.base_price : p.price;
      const delivery = p.price - base;
      return `<div class="pkg-item"><div class="pkg-head"><b>${p.name}</b> ${p.min_people}-${p.max_people}人
        <span class="price-big">¥${p.price}</span>
        <span class="muted">(菜品¥${base}${delivery?` + 配送¥${delivery}`:''})</span>
        <span class="tag tag-blue">${p.service_type}</span> ${p.is_team?'<span class="tag tag-orange">团队</span>':''}</div>
      <div class="pkg-body"><div>🥩 ${ings}</div><div>🔧 ${tools}</div></div></div>`;
    }).join('')||'<span class="muted">无套餐</span>';
    document.getElementById('pkgList').innerHTML=html;
  });
}
function loadSettings(){
  fetch('/api/settings').then(r=>r.json()).then(d=>{
    const v = d.settings && d.settings.delivery_fee ? d.settings.delivery_fee.value : '100';
    document.getElementById('deliveryFee').value = v;
    const pl = d.settings && d.settings.prep_lead_hours ? d.settings.prep_lead_hours.value : '2';
    document.getElementById('prepLead').value = pl;
    const rows = (d.packages||[]).map(p=>`${p.name} ¥${p.price}=${p.base_price}+配送¥${p.delivery}`).join('， ');
    document.getElementById('deliveryHint').textContent = rows;
  });
}
function savePrepLead(){
  const v = document.getElementById('prepLead').value;
  fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prep_lead_hours:v})})
    .then(r=>r.json()).then(()=>{showRefreshToast();});
}
function saveSettings(){
  const v = document.getElementById('deliveryFee').value;
  fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({delivery_fee:v})})
    .then(r=>r.json()).then(()=>{loadSettings();loadPkgs();});
}
function adjustStock(type,id){
  const v=parseFloat(document.getElementById(`adj-${type}-${id}`).value||0);
  if(!v){alert('输入数字');return;}
  const reason=type=='ingredient'?'食材调整':'工具调整';
  fetch('/api/stock/adjust',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_type:type,item_id:id,delta:v,reason})})
    .then(r=>r.json()).then(()=>{type=='ingredient'?loadIngs():loadTools();});
}
function toggleAdd(t){ document.getElementById(t=='ing'?'addIng':'addTool').style.display='block'; }
function addIng(){
  fetch('/api/ingredients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    name:ingName.value,category:ingCat.value,unit:ingUnit.value,stock:parseFloat(ingStock.value||0),threshold:parseFloat(ingThr.value||0),cost:parseFloat(ingCost.value||0)
  })}).then(r=>r.json()).then(()=>{loadIngs();['ingName','ingUnit','ingStock','ingThr','ingCost'].forEach(x=>document.getElementById(x).value='');});
}
function addTool(){
  fetch('/api/tools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    name:toolName.value,stock:parseFloat(toolStock.value||0),threshold:parseFloat(toolThr.value||0),cost:parseFloat(toolCost.value||0)
  })}).then(r=>r.json()).then(()=>{loadTools();['toolName','toolStock','toolThr','toolCost'].forEach(x=>document.getElementById(x).value='');});
}
loadIngs();loadTools();loadPkgs();loadSettings();

// ===== 刷新特效 =====
function refreshWithFx(fn){
  const btn = event.target.closest('.btn-refresh');
  if(btn){ btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'), 800); }
  if(typeof fn === 'function') fn();
  showRefreshToast();
}
function showRefreshToast(){
  let t = document.getElementById('refreshToast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id = 'refreshToast';
  t.className = 'refresh-toast';
  t.textContent = '✓ 已刷新';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
</script>
