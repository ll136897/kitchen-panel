<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>账号管理 · 刘和牛后厨</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;margin:0;padding:14px;color:var(--txt)}
  h2{font-size:19px;margin:6px 0 14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h3{font-size:15px;margin:0 0 10px;color:var(--muted)}
  label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}
  input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:9px;font-size:15px}
  button{background:var(--primary);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
  button.ghost{background:#eee;color:var(--txt)}
  .row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-l)}
  .row:last-child{border-bottom:none}
  .row .nm{font-weight:700}
  .row .rl{font-size:12px;padding:2px 8px;border-radius:8px;margin-left:6px}
  .rl.boss{background:var(--red-bg);color:var(--primary)}
  .row .ds{font-size:12px;color:var(--muted);margin-left:6px}
  .row .acts{margin-left:auto;display:flex;gap:6px}
  .row .acts button{margin:0;padding:6px 10px;font-size:12px}
  .msg{font-size:13px;color:var(--primary);min-height:16px;margin-top:6px}
  .tip{font-size:12px;color:var(--muted);line-height:1.6}
  .pw-wrap{position:relative;display:flex;align-items:center}
  .pw-wrap input{padding-right:54px}
  .pw-toggle{position:absolute;right:8px;margin:0;padding:6px 9px;font-size:12px;background:#f0f0f0;color:var(--txt);border-radius:7px}
</style>
</head>
<body>
{% include 'topbar.html' %}
<h2>账号管理</h2>
<script>const CUR_USER = {{ (cur_user or {})|tojson }}; const IS_BOSS = !!(CUR_USER && CUR_USER.role==='boss');</script>

<div class="card" id="addCard">
  <h3>新增账号</h3>
  <label>用户名（登录用，唯一）</label>
  <input id="nu" placeholder="如 zhang / sun / xiaowang">
  <label>显示名</label>
  <input id="nn" placeholder="如 张总 / 小王">
  <label>角色</label>
  <select id="nr">
    <option value="boss" selected>老板（全权限，含改原数据/配置）</option>
    <option value="partner">合伙人（页面功能全都能用；不能改原数据、不能改别人录的订单）</option>
    <option value="staff">店员/帮手（仅订单/备餐/库存）</option>
  </select>
  <label>初始密码</label>
  <div class="pw-wrap">
    <input id="np" type="password" placeholder="至少 4 位">
    <button type="button" class="pw-toggle" onclick="togglePw('np')">显示</button>
  </div>
  <button onclick="addUser()">添加账号</button>
  <div class="msg" id="addMsg"></div>
</div>

<div class="card">
  <h3>现有账号</h3>
  <div id="list"></div>
</div>

<div class="card">
  <h3>修改我的密码</h3>
  <label>原密码</label>
  <div class="pw-wrap">
    <input id="old" type="password">
    <button type="button" class="pw-toggle" onclick="togglePw('old')">显示</button>
  </div>
  <label>新密码</label>
  <div class="pw-wrap">
    <input id="newp" type="password">
    <button type="button" class="pw-toggle" onclick="togglePw('newp')">显示</button>
  </div>
  <button class="ghost" onclick="changePw()">保存新密码</button>
  <div class="msg" id="pwMsg"></div>
</div>

<p class="tip">说明：<b>老板</b>全权限；<b>合伙人</b>所有页面都能看、功能都能用，但改不了「原数据/配置」（食材单价、套餐、设置、成本参数、账号）和<b>别人录的订单</b>；<b>店员</b>只能看到「订单 / 备餐 / 库存」。禁用等于停用该账号（数据保留）。</p>

<script>
async function load(){
  const ac=document.getElementById('addCard'); if(ac && !IS_BOSS) ac.style.display='none';
  const r=await fetch('/api/users');const d=await r.json();
  const box=document.getElementById('list');box.innerHTML='';
  (d.users||[]).forEach(u=>{
    const div=document.createElement('div');div.className='row';
    const rl=u.role==='boss'?'老板':(u.role==='partner'?'合伙人':'店员');
    const ds=u.active?'':'（已禁用）';
    div.innerHTML=`<span class="nm">${u.name||u.username}</span>
      <span class="rl ${u.role}">${rl}</span><span class="ds">${u.username}${ds}</span>
      <span class="acts">
        ${IS_BOSS ? `<button class="ghost" onclick="toggle(${u.id})">${u.active?'禁用':'启用'}</button>
        <button class="ghost" onclick="resetPw(${u.id})">重置密码</button>
        <button class="ghost" onclick="del(${u.id})">删除</button>` : ''}
      </span>`;
    box.appendChild(div);
  });
}
async function addUser(){
  const username=document.getElementById('nu').value.trim();
  const name=document.getElementById('nn').value.trim();
  const role=document.getElementById('nr').value;
  const password=document.getElementById('np').value;
  const m=document.getElementById('addMsg');
  if(!username||!password){m.textContent='用户名和密码必填';return;}
  const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,name,role,password})});
  const d=await r.json();
  m.textContent=d.ok?'添加成功':'失败：'+(d.msg||'');
  if(d.ok){document.getElementById('nu').value='';document.getElementById('nn').value='';document.getElementById('np').value='';load();}
}
async function toggle(id){await fetch('/api/users/'+id+'/toggle',{method:'POST'});load();}
async function del(id){if(!confirm('确认禁用该账号？'))return;await fetch('/api/users/'+id,{method:'DELETE'});load();}
async function resetPw(id){
  const p=prompt('输入新密码（至少 4 位）');if(!p)return;
  const r=await fetch('/api/users/'+id+'/reset-pw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
  const d=await r.json();alert(d.ok?'已重置':'失败：'+(d.msg||''));
}
async function changePw(){
  const m=document.getElementById('pwMsg');
  const r=await fetch('/api/me/change-pw',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({old:document.getElementById('old').value,new:document.getElementById('newp').value})});
  const d=await r.json();m.textContent=d.ok?'密码已更新':'失败：'+(d.msg||'');
}
function togglePw(id){
  const el=document.getElementById(id);const btn=el.parentElement.querySelector('.pw-toggle');
  if(el.type==='password'){el.type='text';btn.textContent='隐藏';}
  else{el.type='password';btn.textContent='显示';}
}
load();
</script>
</body>
</html>
