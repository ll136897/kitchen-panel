<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>订单列表 · 刘和牛户外烤肉</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .cell.clickable{cursor:pointer;transition:color .12s}
  .cell.clickable:hover .v{text-decoration:underline;color:var(--primary)}
  .cell.clickable .k::after{content:' 🔗';font-size:11px;opacity:.5}
  /* 分组筛选条 */
  #groupBar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
    padding:12px 14px;background:linear-gradient(90deg,#fff7ed,#fff);border:1px solid #fed7aa}
  .scope-chip{padding:6px 14px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--border);
    background:#fff;color:#5a4a3a;cursor:pointer;line-height:1}
  .scope-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .scope-chip:hover{filter:brightness(.97)}
  .order-card.anchor{border-left:4px solid var(--primary);box-shadow:0 0 0 2px rgba(192,57,43,.12)}
  .anchor-flag{display:inline-block;background:var(--primary);color:#fff;font-size:11px;font-weight:700;
    padding:1px 8px;border-radius:8px;margin-left:8px;vertical-align:middle}
  /* 批量选择 */
  .batch-chk{width:18px;height:18px;margin-right:8px;cursor:pointer;accent-color:var(--primary);flex:0 0 auto}
  .order-card.selected{border-left:4px solid var(--primary);box-shadow:0 0 0 2px rgba(192,57,43,.12)}
  #batchBtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  #batchBar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;gap:10px;
    padding:12px 16px;background:#fff;border-top:2px solid var(--primary);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
  #batchBar .batch-count{font-weight:700;color:var(--primary);white-space:nowrap}
  #batchActions{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
  @media(max-width:600px){
    .cell.clickable .k::after{content:''}
    #groupBar{gap:6px}
    .scope-chip{padding:5px 10px;font-size:13px}
    #batchBar{gap:8px;padding:10px 12px}
    #batchBar .btn{padding:8px 10px;font-size:13px}
  }
  /* 搜索框 + 日期快捷切换（与备餐页同款风格） */
  .search-row{display:flex;gap:8px;margin:12px 0 12px;flex-wrap:wrap;align-items:center}
  #searchBox{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px}
  .date-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .date-chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:13px;cursor:pointer;color:#5a4a3a;white-space:nowrap}
  .date-chip:hover{filter:brightness(.97)}
  .date-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .date-chip .cnt{opacity:.7;font-size:12px;margin-left:4px}
  .order-count-hint{font-size:12px;color:#9a3412;margin:-4px 0 10px}
  /* 排序切换（出餐日期 / 加入顺序） */
  .sort-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .sort-label{font-size:12px;color:#9a3412;font-weight:600;margin-right:2px}
  .sort-chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:13px;cursor:pointer;color:#5a4a3a;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .sort-chip:hover{filter:brightness(.97)}
  .sort-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .sort-sep{width:1px;height:16px;background:var(--border);margin:0 2px}
  /* 按月分组：月份条可展开/收回 */
  .month-group{margin-bottom:8px}
  .month-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;user-select:none;font-weight:700;color:#5a4a3a}
  .month-head:hover{filter:brightness(.98)}
  .month-group.cur .month-head{border-color:var(--primary);background:#fffaf9}
  .month-caret{font-size:11px;width:12px;text-align:center;color:#9a3412;flex:0 0 auto}
  .month-name{font-size:14px}
  .month-group.cur .month-name{color:var(--primary)}
  .month-meta{margin-left:auto;font-size:12px;font-weight:600;color:#9a3412;opacity:.9;white-space:nowrap}
  .month-body{margin-top:10px}
</style>
</head>
<body>
{% include 'topbar.html' %}

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px">
    <div>
      <div class="title"><span class="fire">🔥</span>订单列表</div>
      <div class="sub">查看、跟踪和管理所有订单</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="batchBtn" class="btn btn-sm btn-refresh" onclick="toggleBatch()">☑️ 批量</button>
      <button id="trashBtn" class="btn btn-sm btn-refresh" onclick="toggleTrash()">🗑 回收站</button>
      <button class="btn btn-primary btn-sm btn-refresh" onclick="refreshWithFx(loadOrders)"><span class="btn-icon">🔄</span> 刷新</button>
    </div>
  </div>

  <div id="trashTip" class="card" style="display:none;margin-bottom:14px;padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px">
    ♻️ <b>回收站</b>：被删除的订单会在 7 天内保留，可随时「恢复」；超过 7 天会被自动彻底清除。点「彻底删除」可立即永久清除（不可恢复）。
  </div>

  <!-- 按地址/联系人分组筛选条（点订单的地址或联系人时出现） -->
  <div id="groupBar" class="card">
    <button class="btn btn-sm btn-refresh" onclick="clearGroup()">← 返回全部</button>
    <span id="groupTag" style="font-weight:700;font-size:15px;color:var(--primary)"></span>
    <span id="groupSummary" class="muted" style="font-size:13px"></span>
    <span style="margin-left:auto;display:inline-flex;gap:6px">
      <button class="scope-chip active" data-scope="all" onclick="setScope('all')">全部</button>
      <button class="scope-chip" data-scope="week" onclick="setScope('week')">本周</button>
      <button class="scope-chip" data-scope="month" onclick="setScope('month')">本月</button>
    </span>
  </div>

  <!-- 搜索框 + 日期快捷切换（与备餐页同款，方便快速查找） -->
  <div class="search-row">
    <input id="searchBox" type="search" placeholder="🔍 搜 姓名 / 电话 / 地址 / 日期 / 备注 / 订单号" oninput="onSearch(this.value)">
    <button class="btn btn-sm btn-refresh" onclick="clearSearch()">✕ 清除</button>
  </div>
  <div class="date-chips" id="orderDateChips"></div>
  <div class="sort-chips" id="orderSortChips">
    <span class="sort-label">排序</span>
    <button class="sort-chip active" data-mode="date" onclick="setSort('date')">📅 出餐日期</button>
    <button class="sort-chip" data-mode="join" onclick="setSort('join')">🆔 加入顺序</button>
    <span class="sort-sep"></span>
    <button class="sort-chip active" id="monthChip" onclick="toggleMonthMode()">📆 按月分组</button>
    <button class="sort-chip" id="collapseAllChip" onclick="toggleCollapseAll()">⇕ 全部收起</button>
  </div>
  <div id="orderCountHint" class="order-count-hint" style="display:none"></div>

  <!-- 顶部 KPI 计数条（简单的小卡，复用 kpi-row） -->
  <div class="kpi-row" id="orderKPIs" style="margin-bottom:16px"></div>

  <div class="order-list" id="orderList"></div>
</div>

<!-- 工具归还弹窗 -->
<div id="returnModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:560px;width:100%;max-height:90vh;overflow:auto">
    <h3>🔧 工具归还 · 订单 <span id="retOid"></span></h3>
    <div class="muted" style="font-size:12px;margin-bottom:10px">核对归还数量，丢失/损坏需填写（将从库存扣除并记录报损）</div>
    <table class="tbl" id="retTable">
      <thead><tr><th>工具</th><th>借出</th><th>归还</th><th>丢失/损坏</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary" onclick="submitReturn()">✅ 确认归还</button>
      <button class="btn" onclick="closeReturn()">取消</button>
    </div>
  </div>
</div>

<!-- 批量操作栏 -->
<div id="batchBar">
  <span class="batch-count">已选 0 个</span>
  <button class="btn btn-sm btn-refresh" onclick="selectAll()">全选</button>
  <button class="btn btn-sm" onclick="clearSel()">清空</button>
  <span id="batchActions"></span>
  <button class="btn btn-sm" onclick="toggleBatch()">✕ 退出</button>
</div>

<script>
function statusLabel(s){
  const map = {
    pending:   ['⏳ 待备',    'tag-orange'],
    preparing: ['🔥 备餐中',  'tag-blue'],
    done:      ['✅ 已完成',  'tag-green'],
    cancelled: ['❌ 已取消',  'tag-gray'],
  };
  return map[s] || ['未知','tag-gray'];
}
function cardClass(s){ return s in {pending:1,preparing:1,done:1,cancelled:1} ? s : ''; }

let showDeleted = false;
let allOrders = [];
let selMode = false;          // 是否进入批量选择模式
let selectedIds = new Set();  // 已勾选的订单 id
let currentVisibleIds = [];   // 当前渲染出来的订单 id（用于全选）
let groupField = null;     // 'address' | 'contact_name' | null
let groupAnchorId = null;  // 点的是哪一单（用来高亮 + 作为周/月基准）
let groupScope = 'all';    // 'all' | 'week' | 'month'
let filterText = '';       // 搜索关键字
let filterDate = '';       // 按日期筛选（''=全部日期）
let sortMode = 'date';     // 排序方式：'date'=出餐日期（默认） | 'join'=加入顺序
let monthMode = true;            // 是否按月分组显示（默认开）
let collapsedMonths = new Set(); // 已收起的月份（'YYYY-MM'）
let lastMonthKeys = [];          // 最近一次渲染出现的月份（供"全部收起/展开"用）

// 地址归并用的键：后端算好的"归一地址"（青龙湖二期 → 青龙湖）。
// 旧的 /api/orders 没这个字段时退回原地址，保证任何情况下都能用。
function addrKey(o){ return o.address_key || o.address || ''; }

function toggleTrash(){
  showDeleted = !showDeleted;
  loadOrders();
}

// 排序键： booking_date + 用餐/预订时间
function orderDt(o){
  const t = (o.meal_time || o.booking_time || o.pickup_time || '');
  return (o.booking_date || '0000-00-00') + ' ' + (t || '00:00');
}
// date 是否落在以 anchorDate 为基准的 周/月 范围内
function inScope(dateStr, anchorDate, scope){
  if(!dateStr || !anchorDate) return false;
  if(scope==='month') return dateStr.slice(0,7) === anchorDate.slice(0,7);
  if(scope==='week'){
    const w = (s)=>{ const d=new Date(s+'T00:00:00Z'); const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day); return d.toISOString().slice(0,10); };
    return w(dateStr) === w(anchorDate);
  }
  return true;
}

function groupBy(field, anchorId){
  groupField = field; groupAnchorId = anchorId; groupScope = 'all';
  renderOrders(); window.scrollTo(0,0);
}
function clearGroup(){
  groupField = null; groupAnchorId = null; groupScope = 'all';
  renderOrders(); window.scrollTo(0,0);
}
function setScope(s){
  groupScope = s;
  document.querySelectorAll('.scope-chip').forEach(b=>b.classList.toggle('active', b.dataset.scope===s));
  renderOrders();
}

function loadOrders(){
  const url = showDeleted ? '/api/orders?deleted=1' : '/api/orders';
  return fetch(url).then(r=>r.json()).then(d=>{
    if(!d.ok) return;
    allOrders = d.data || [];
    const nDel = d.deleted_count || 0;
    const btn = document.getElementById('trashBtn');
    if(btn){
      btn.textContent = showDeleted ? '← 返回订单列表' : `🗑 回收站${nDel?`（${nDel}）`:''}`;
      btn.style.background = showDeleted ? '#6b7280' : (nDel ? '#c0392b' : '');
      btn.style.color = (showDeleted || nDel) ? '#fff' : '';
    }
    const tip = document.getElementById('trashTip');
    if(tip) tip.style.display = showDeleted ? 'block' : 'none';
    renderOrderDateChips();
    renderSortChips();
    renderOrders();
  });
}

// ===== 搜索 + 日期快捷切换（同款备餐页）=====
function onSearch(v){ filterText = (v||'').trim(); renderOrders(); }
function clearSearch(){ const b=document.getElementById('searchBox'); if(b) b.value=''; filterText=''; renderOrders(); }
function setOrderDate(d){ filterDate = d; renderOrderDateChips(); renderOrders(); }
function renderOrderDateChips(){
  const box = document.getElementById('orderDateChips');
  if(!box) return;
  const counts = {};
  allOrders.forEach(o=>{ if(o.booking_date) counts[o.booking_date] = (counts[o.booking_date]||0)+1; });
  const dates = Object.keys(counts).sort().reverse();
  let html = `<button class="date-chip ${filterDate===''?'active':''}" onclick="setOrderDate('')">全部日期</button>`;
  html += dates.map(d=>`<button class="date-chip ${filterDate===d?'active':''}" onclick="setOrderDate('${d}')">${d.slice(5)} <span class="cnt">${counts[d]}</span></button>`).join('');
  box.innerHTML = html;
}

// 排序切换：出餐日期 / 加入顺序
function setSort(m){ sortMode = m; renderSortChips(); renderOrders(); }
function renderSortChips(){
  const box = document.getElementById('orderSortChips');
  if(!box) return;
  box.querySelectorAll('.sort-chip[data-mode]').forEach(b=>b.classList.toggle('active', b.dataset.mode===sortMode));
}
function joinKey(o){ return o.created_at || ('0000000000'+(o.id||0)).slice(-10); }

// ===== 按月分组（可展开/收回）=====
function monthKey(o){ return (o.booking_date||'').slice(0,7) || '未知'; }
function thisMonthKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(k){
  const p = k.split('-');
  if(p.length===2 && p[0]) return `${p[0]}年${parseInt(p[1],10)}月`;
  return k==='未知' ? '日期未知' : k;
}
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('zh-CN'); }
function currentMonthKeys(){
  const ks = allOrders.map(monthKey);
  return [...new Set(ks)].sort().reverse();
}
function toggleMonthMode(){ monthMode = !monthMode; renderOrders(); }
function toggleMonth(k){
  if(collapsedMonths.has(k)) collapsedMonths.delete(k); else collapsedMonths.add(k);
  renderOrders();
}
function toggleCollapseAll(){
  const keys = lastMonthKeys.length ? lastMonthKeys : currentMonthKeys();
  const allCollapsed = keys.length>0 && keys.every(k=>collapsedMonths.has(k));
  if(allCollapsed) keys.forEach(k=>collapsedMonths.delete(k));
  else keys.forEach(k=>collapsedMonths.add(k));
  renderOrders();
}
function renderMonthChips(){
  const mc = document.getElementById('monthChip');
  if(mc) mc.classList.toggle('active', monthMode);
  const ca = document.getElementById('collapseAllChip');
  if(ca){
    ca.style.display = monthMode ? '' : 'none';
    const keys = lastMonthKeys.length ? lastMonthKeys : currentMonthKeys();
    const allCollapsed = keys.length>0 && keys.every(k=>collapsedMonths.has(k));
    ca.textContent = allCollapsed ? '⇕ 全部展开' : '⇕ 全部收起';
  }
}

// 列表渲染：按月分组（月份条可点开展开/收回）或平铺；isGroup=true 时高亮锚点卡片
function renderOrderList(list, isGroup){
  if(!list.length){
    lastMonthKeys = [];
    return `<div class="card" style="text-align:center;padding:40px;color:#aaa"><div style="font-size:40px;margin-bottom:12px">🍖</div>${isGroup ? '该范围内暂无订单' : ((filterText||filterDate) ? '没有匹配的订单，换个关键字或日期试试' : '还没有订单，去 <a href="/">录单页</a> 创建第一笔吧')}</div>`;
  }
  const cardAt = (o)=>buildCard(o, isGroup && o.id===groupAnchorId);
  if(!monthMode){ lastMonthKeys = []; return list.map(cardAt).join(''); }
  const groups = {};
  list.forEach(o=>{ const k=monthKey(o); (groups[k]=groups[k]||[]).push(o); });
  const keys = Object.keys(groups).sort().reverse();   // 月份新的在前；月内沿用当前排序
  lastMonthKeys = keys;
  const cur = thisMonthKey();
  return keys.map(k=>{
    const arr = groups[k];
    const collapsed = collapsedMonths.has(k);
    const amt = arr.reduce((s,o)=> s + (o.status!=='cancelled' ? (o.amount||0) : 0), 0);
    return `<div class="month-group${k===cur?' cur':''}">
      <div class="month-head" onclick="toggleMonth('${k}')">
        <span class="month-caret">${collapsed?'▸':'▾'}</span>
        <span class="month-name">${monthLabel(k)}</span>
        <span class="month-meta">${arr.length} 单 · ¥${money(amt)}</span>
      </div>
      ${collapsed ? '' : `<div class="month-body">${arr.map(cardAt).join('')}</div>`}
    </div>`;
  }).join('');
}

// 单张订单卡片（分组时 anchor=true 会高亮并打标）
function buildCard(o, isAnchor){
  const pkgs = (o.packages||[]).map(p=>`<span class="chip pkg">${p.name}·${p.people}人 × ${p.quantity}</span>`).join('') || '';
  const [stText, stCls] = statusLabel(o.status);
  const anchorFlag = isAnchor ? `<span class="anchor-flag">← 你点的这单</span>` : '';
  return `<div class="order-card ${cardClass(o.status)}${isAnchor?' anchor':''}${selectedIds.has(o.id)?' selected':''}" id="ocard-${o.id}">
    <div class="order-head">
      <div style="display:flex;align-items:center">
        ${selMode ? `<input type="checkbox" class="batch-chk" data-oid="${o.id}" ${selectedIds.has(o.id)?'checked':''} onchange="toggleSel(${o.id}, this.checked)">` : ''}
        <b style="font-size:16px">#${o.id}</b>
        <span class="muted" style="margin-left:6px">${o.booking_date||''} ${o.booking_time||''}</span>${anchorFlag}
      </div>
      <span class="tag ${stCls} tag-lg">${stText}</span>
    </div>

    <div class="preview-grid" style="margin:8px 0">
      <div class="cell clickable" onclick="groupBy('address', ${o.id})"><div class="k">📍 地址</div><div class="v">${o.address||'-'}</div></div>
      <div class="cell clickable" onclick="groupBy('contact_name', ${o.id})"><div class="k">👤 联系人</div><div class="v">${o.contact_name||'-'}</div></div>
      <div class="cell"><div class="k">📞 电话</div><div class="v">${o.contact_phone?`<a href="tel:${o.contact_phone}">${o.contact_phone}</a>`:'-'}</div></div>
      <div class="cell"><div class="k">💰 金额 / 押金</div><div class="v">¥${o.amount||'-'} / ¥${o.deposit||'-'}</div></div>
    </div>

    <div class="chips">${pkgs}</div>
    ${o.note?`<div class="note-box"><b>📝 备注：</b>${o.note}</div>`:''}

    <div class="btn-row">
      ${showDeleted ? `
        <button class="btn btn-sm btn-success" onclick="restoreOrder(${o.id})">♻️ 恢复</button>
        <button class="btn btn-sm btn-danger" onclick="purgeOrder(${o.id},'${o.contact_name||''}')">🔥 彻底删除</button>
      ` : `
      <button class="btn btn-sm" onclick="viewReq(${o.id})">📊 备餐需求</button>
      <button class="btn btn-sm" style="background:#27ae60;color:#fff" onclick="window.open('/orders/${o.id}/ticket','_blank')">🖨 出餐单</button>
      <button class="btn btn-sm" style="background:#c0392b;color:#fff" onclick="location.href='/prep?focus=${o.id}'">🍱 备餐核对</button>
      ${o.status==='pending' ? `<button class="btn btn-sm btn-accent" onclick="setStatus(${o.id},'preparing')">🔥 开始备餐</button>` : ''}
      ${o.status!=='done' && o.status!=='cancelled' ? `<button class="btn btn-sm btn-success" onclick="setStatus(${o.id},'done')">✅ 完成</button>` : ''}
      ${(o.status==='preparing' || o.status==='done') ? `<button class="btn btn-sm" onclick="openReturn(${o.id})">🔧 归还工具</button>` : ''}
      ${(o.status==='done'||o.status==='cancelled') ? `<button class="btn btn-sm btn-danger" onclick="delOrder(${o.id},'${o.contact_name||''}')">🗑 删除</button>` : ''}
      ${o.status!=='cancelled' && o.status!=='done' ? `<button class="btn btn-sm btn-danger" onclick="setStatus(${o.id},'cancelled')">❌ 取消</button>` : ''}
      `}
    </div>
    <div id="req-${o.id}" class="req-box" style="display:none"></div>
  </div>`;
}

function renderOrders(){
  const box = document.getElementById('orderList');
  const kpis = document.getElementById('orderKPIs');
  // 顶部 KPI 始终按全部订单统计
  const count = {pending:0,preparing:0,done:0,cancelled:0};
  let totalAmt = 0;
  allOrders.forEach(o=>{ count[o.status]=(count[o.status]||0)+1; if(o.status!=='cancelled') totalAmt += (o.amount||0); });
  if(kpis) kpis.innerHTML = [
    {cls:'kpi-dark',icon:'📋',num:allOrders.length,lbl:'全部订单'},
    {cls:'kpi-red',icon:'⏳',num:count.pending,lbl:'待备'},
    {cls:'kpi-orange',icon:'🔥',num:count.preparing,lbl:'备餐中'},
    {cls:'kpi-green',icon:'✅',num:count.done,lbl:'已完成'},
  ].map(k=>`<div class="kpi ${k.cls}"><div class="kpi-icon">${k.icon}</div><div class="kpi-num">${k.num}</div><div class="kpi-lbl">${k.lbl}</div></div>`).join('');

  // 应用搜索 + 日期筛选
  let list = allOrders;
  if(filterDate) list = list.filter(o=>o.booking_date===filterDate);
  if(filterText){
    const q = filterText.toLowerCase();
    list = list.filter(o=> [o.contact_name,o.contact_phone,o.address,o.booking_date,o.note,String(o.id)]
      .some(f=>(f||'').toLowerCase().includes(q)));
  }
  // 排序：默认按出餐日期（新日期在前），可切到加入顺序（先录入的在前）
  list = list.slice().sort((a,b)=>{
    if(sortMode==='join'){ const ca=joinKey(a), cb=joinKey(b); return ca<cb?-1:(ca>cb?1:0); }
    const da=orderDt(a), db=orderDt(b);
    return db<da?-1:(db>da?1:0);
  });
  const hint = document.getElementById('orderCountHint');
  if(hint){
    if(filterText || filterDate){
      hint.style.display='block';
      hint.textContent = `🔎 筛选出 ${list.length} 条（共 ${allOrders.length} 条）${filterDate?(' · '+filterDate):''}${filterText?(' · 含“'+filterText+'”'):''}`;
    } else hint.style.display='none';
  }

  if(!groupField){
    document.getElementById('groupBar').style.display='none';
    box.innerHTML = renderOrderList(list, false);
    finishRender();
    return;
  }
  // 分组视图：按地址/联系人聚合，默认按点击订单的时间排（默认全部时段）
  // 地址用"归一后的地址"（青龙湖二期 → 青龙湖），同一个地方的不同写法算一个地方
  const anchor = list.find(o=>o.id===groupAnchorId) || {};
  const val = (groupField==='address' ? addrKey(anchor) : (anchor.contact_name||''));
  list = list.filter(o=> (groupField==='address' ? addrKey(o) : (o.contact_name||'')) === val);
  if(groupScope!=='all') list = list.filter(o=> inScope(o.booking_date, anchor.booking_date, groupScope));
  // 排序已在上文按 sortMode 完成（出餐日期 / 加入顺序）

  const gb = document.getElementById('groupBar');
  gb.style.display = 'flex';
  const tagIcon = groupField==='address' ? '📍' : '👤';
  // 合并了不同写法的场地时，把其它写法标注出来——解释"为什么这两个也算同一个地方"
  let tagTxt = `${tagIcon} ${val || '（空）'}`;
  if(groupField==='address'){
    const variants = [...new Set(list.map(o=>(o.address||'（空）')).filter(a=>a!==val))];
    if(variants.length) tagTxt += ` · 含${variants.slice(0,2).join('/')}${variants.length>2?'等':''}`;
  }
  document.getElementById('groupTag').textContent = tagTxt;
  const sumAmt = list.reduce((s,o)=> s + (o.status!=='cancelled' ? (o.amount||0) : 0), 0);
  const scopeTxt = groupScope==='all' ? '全部时段' : (groupScope==='week' ? '本周' : '本月');
  document.getElementById('groupSummary').textContent = `· 共 ${list.length} 单 · 合计 ¥${sumAmt} · ${scopeTxt}`;
  document.querySelectorAll('.scope-chip').forEach(b=>b.classList.toggle('active', b.dataset.scope===groupScope));

  box.innerHTML = renderOrderList(list, true);
  finishRender();
}

function finishRender(){
  const box = document.getElementById('orderList');
  currentVisibleIds = [...box.querySelectorAll('.order-card')].map(c=>parseInt(c.id.replace('ocard-',''),10));
  renderMonthChips();
  updateBatchBar();
}

function viewReq(oid){
  const box = document.getElementById('req-'+oid);
  if(box.style.display!='none'){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = '<div class="muted">加载中...</div>';
  fetch('/api/orders/'+oid+'/requirements').then(r=>r.json()).then(d=>{
    if(!d.ok) return;
    const data = d.data;
    const ings = (data.ingredients||[]).map(x=>{
      const cls = x.shortage>0 ? 'row-warn' : '';
      return `<tr class="${cls}"><td>${x.name}</td><td>${x.need}${x.unit||''}</td><td>${x.stock}${x.unit||''}</td><td class="${x.shortage>0?'txt-red':''}">${x.shortage>0?x.shortage+x.unit:'-'}</td></tr>`;
    }).join('') || '<tr><td colspan=4 class="muted">无</td></tr>';
    const tools = (data.tools||[]).map(x=>{
      const cls = x.shortage>0 ? 'row-warn' : '';
      return `<tr class="${cls}"><td>${x.name}</td><td>${x.need}</td><td>${x.stock}</td><td class="${x.shortage>0?'txt-red':''}">${x.shortage>0?x.shortage:'-'}</td></tr>`;
    }).join('') || '<tr><td colspan=4 class="muted">无</td></tr>';
    box.innerHTML = `
      <h4 style="color:var(--primary);font-size:14px;margin:8px 0 4px">🥩 食材需求</h4>
      <table class="tbl"><thead><tr><th>食材</th><th>需求</th><th>库存</th><th>缺口</th></tr></thead><tbody>${ings}</tbody></table>
      <h4 style="color:var(--primary);font-size:14px;margin:12px 0 4px">🔧 工具需求</h4>
      <table class="tbl"><thead><tr><th>工具</th><th>需求</th><th>库存</th><th>缺口</th></tr></thead><tbody>${tools}</tbody></table>
    `;
  });
}

function setStatus(oid,st){
  fetch('/api/orders/'+oid,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st})})
    .then(r=>r.json()).then(()=>loadOrders());
}

function delOrder(oid,name){
  const who = name ? `（${name}）` : '';
  if(!confirm(`确定把订单 #${oid}${who} 放进回收站？\n7 天内可在「回收站」恢复；超过 7 天将自动彻底清除。\n该单的备餐记录、工具借还仍会保留。`)) return;
  fetch('/api/orders/'+oid,{method:'DELETE'})
    .then(r=>r.json()).then(d=>{
      if(d && d.ok){ loadOrders(); showRefreshToast(); }
      else alert((d && d.msg) || '删除失败');
    }).catch(()=>alert('删除失败：网络错误'));
}

function toggleBatch(){
  selMode = !selMode;
  if(!selMode) selectedIds.clear();
  const b = document.getElementById('batchBtn');
  if(b) b.classList.toggle('active', selMode);
  renderOrders();
}
function toggleSel(oid, checked){
  if(checked) selectedIds.add(oid); else selectedIds.delete(oid);
  const card = document.getElementById('ocard-'+oid);
  if(card) card.classList.toggle('selected', checked);
  updateBatchBar();
}
function selectAll(){
  currentVisibleIds.forEach(id=>selectedIds.add(id));
  syncCheck();
}
function clearSel(){ selectedIds.clear(); syncCheck(); }
function syncCheck(){
  document.querySelectorAll('.batch-chk').forEach(c=>{
    const oid = parseInt(c.dataset.oid,10);
    c.checked = selectedIds.has(oid);
    const card = document.getElementById('ocard-'+oid);
    if(card) card.classList.toggle('selected', c.checked);
  });
  updateBatchBar();
}
function updateBatchBar(){
  const bar = document.getElementById('batchBar');
  if(!bar) return;
  bar.style.display = selMode ? 'flex' : 'none';
  const cnt = bar.querySelector('.batch-count');
  if(cnt) cnt.textContent = `已选 ${selectedIds.size} 个`;
  const list = document.getElementById('orderList');
  if(list) list.style.paddingBottom = selMode ? '84px' : '';
  const acts = document.getElementById('batchActions');
  if(!acts) return;
  if(showDeleted){
    acts.innerHTML = `<button class="btn btn-sm btn-success" onclick="batchAction('restore')">♻️ 批量恢复</button>
      <button class="btn btn-sm btn-danger" onclick="batchAction('purge')">🔥 批量彻底删除</button>`;
  } else {
    acts.innerHTML = `<button class="btn btn-sm btn-danger" onclick="batchAction('delete')">🗑 批量删除(进回收站)</button>`;
  }
}
function batchAction(action){
  const ids = [...selectedIds];
  if(!ids.length){ alert('请先勾选要操作的订单'); return; }
  const txt = {
    delete:  `确定把选中的 ${ids.length} 个订单放进回收站？\n7 天内可在回收站恢复；超过 7 天自动彻底清除。`,
    restore: `确定恢复选中的 ${ids.length} 个订单？`,
    purge:   `⚠️ 确定彻底删除选中的 ${ids.length} 个订单？\n此操作不可恢复！`
  }[action];
  if(!confirm(txt)) return;
  fetch('/api/orders/batch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,ids})})
    .then(r=>r.json()).then(d=>{
      if(d && d.ok){ selectedIds.clear(); toggleBatch(); loadOrders(); showRefreshToast(); }
      else alert((d&&d.msg)||'操作失败');
    }).catch(()=>alert('操作失败：网络错误'));
}

function restoreOrder(oid){
  if(!confirm(`确定恢复订单 #${oid}？\n恢复后它将回到正常订单列表。`)) return;
  fetch('/api/orders/'+oid+'/restore',{method:'POST'})
    .then(r=>r.json()).then(d=>{
      if(d && d.ok){ loadOrders(); showRefreshToast(); }
      else alert((d && d.msg) || '恢复失败');
    }).catch(()=>alert('恢复失败：网络错误'));
}

function purgeOrder(oid,name){
  const who = name ? `（${name}）` : '';
  if(!confirm(`⚠️ 彻底删除订单 #${oid}${who}？\n此操作不可恢复，该单的备餐记录、工具借还将一并永久清除。`)) return;
  fetch('/api/orders/'+oid+'/purge',{method:'DELETE'})
    .then(r=>r.json()).then(d=>{
      if(d && d.ok){ loadOrders(); showRefreshToast(); }
      else alert((d && d.msg) || '彻底删除失败');
    }).catch(()=>alert('彻底删除失败：网络错误'));
}

let currentReturnOid = null;
function openReturn(oid){
  currentReturnOid = oid;
  document.getElementById('retOid').textContent = '#'+oid;
  const tbody = document.querySelector('#retTable tbody');
  tbody.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">加载中...</td></tr>';
  document.getElementById('returnModal').style.display = 'flex';
  fetch('/api/orders/'+oid+'/loans').then(r=>r.json()).then(d=>{
    if(!d.ok || !d.data.length){
      tbody.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">该订单暂无工具借出记录（需先点"开始备餐"）</td></tr>';
      return;
    }
    tbody.innerHTML = d.data.map(l=>`
      <tr>
        <td><b>${l.tool_name}</b></td>
        <td>${l.quantity}</td>
        <td><input type="number" id="ret-${l.id}" value="${l.returned_qty||l.quantity}" min="0" max="${l.quantity}" style="width:60px;padding:4px;border:1px solid var(--border);border-radius:6px"></td>
        <td><input type="number" id="lost-${l.id}" value="${l.lost_qty||0}" min="0" max="${l.quantity}" style="width:60px;padding:4px;border:1px solid var(--border);border-radius:6px"></td>
      </tr>`).join('');
  });
}
function closeReturn(){ document.getElementById('returnModal').style.display='none'; }
function submitReturn(){
  if(!currentReturnOid) return;
  const items = [];
  document.querySelectorAll('#retTable tbody tr').forEach(tr=>{
    const inputs = tr.querySelectorAll('input');
    if(inputs.length===2){
      const loanId = parseInt(inputs[0].id.replace('ret-',''));
      items.push({loan_id:loanId, returned_qty:parseFloat(inputs[0].value||0), lost_qty:parseFloat(inputs[1].value||0)});
    }
  });
  fetch('/api/orders/'+currentReturnOid+'/tools/return',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items})}).then(r=>r.json()).then(d=>{
      if(d.ok){ alert('✅ 归还记录已保存'); closeReturn(); loadOrders(); }
      else alert('失败：'+(d.msg||''));
    });
}

// 深度联动：从备餐页点"📋 看该订单"跳过来时，自动按这单的地址分组
const _op = new URLSearchParams(location.search).get('focus');
const _oid = _op ? parseInt(_op, 10) : null;
loadOrders().then(()=>{
  if(_oid){
    const fo = allOrders.find(o=>o.id===_oid);
    if(fo) groupBy('address', fo.id);
  }
});

// ===== 刷新特效 =====
function refreshWithFx(fn){
  const btn = event.target.closest('.btn-refresh');
  if(btn){ btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'), 800); }
  if(typeof fn === 'function') fn();
  showRefreshToast();
}
function showRefreshToast(){
  let t = document.getElementById('refreshToast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id = 'refreshToast';
  t.className = 'refresh-toast';
  t.textContent = '✓ 已刷新';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
async function doBackup(){const b=event.target;b.textContent='⏳ 备份中...';b.disabled=true;try{const r=await fetch('/api/backup',{method:'POST'});const d=await r.json();if(d.ok){b.textContent='✅ 已备份';setTimeout(()=>{b.textContent='💾 备份';b.disabled=false},2000)}else{alert(d.msg||'备份失败');b.textContent='💾 备份';b.disabled=false}}catch(e){alert('备份失败：网络错误');b.textContent='💾 备份';b.disabled=false}}
</script>
